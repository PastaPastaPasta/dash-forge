# E2E storage backend fixtures for dash-forge.
#
# Brings up local stand-ins for the storage adapters under test:
#   - kubo:         IPFS node (write via API, read via gateway)
#   - rustfs:       S3-compatible object storage (+ one-shot bucket bootstrap, s3-init):
#                     forge-packs — anonymous read+write (the legacy public-bucket fixture)
#                     forge-byo   — SigV4-signed writes (minioadmin/minioadmin), anonymous
#                                   reads, CORS for any origin: the shape of a real
#                                   R2/B2/S3 bring-your-own bucket
#   - static-http:  plain HTTPS-style static file host (nginx)
#
# The S3 fixture was MinIO until the minio/minio and minio/mc images stopped pulling
# ("pull access denied"; the upstream repository was archived in 2026-04). RustFS replaces
# it because it serves anonymous requests through bucket policies, which both buckets need
# (Garage has no anonymous S3 access, so it cannot stand in). The S3 images are pinned by
# tag and digest so a fresh machine or CI runner pulls exactly what was tested; bump both
# together.
#
# Usage: docker compose -f infra/docker-compose.yml up -d
#        docker compose -f infra/docker-compose.yml down -v

services:
  kubo:
    image: ipfs/kubo:latest
    container_name: forge-e2e-kubo
    restart: unless-stopped
    # Local-test node only: run with the DHT disabled and no public swarm so
    # content-addressed storage tests never announce or serve data to the public
    # IPFS network. Swarm port 4001 is intentionally NOT published. IPFS_PROFILE
    # 'server' disables local-network discovery; Routing.Type=none + empty Swarm
    # addresses keep it fully private. (Set via init profile + config on boot.)
    environment:
      IPFS_PROFILE: server
    ports:
      - "127.0.0.1:5001:5001" # HTTP API (localhost only)
      - "127.0.0.1:8081:8080" # Gateway (localhost only)
    volumes:
      - kubo-data:/data/ipfs
    entrypoint:
      - /bin/sh
      - -c
      - |
        ipfs init --profile server 2>/dev/null || true
        ipfs config Routing.Type none
        ipfs config --json Swarm.DisableNatPortMap true
        ipfs config --json Addresses.Swarm '[]'
        # Bind the RPC API + Gateway to 0.0.0.0 *inside the container* so the
        # published host ports (127.0.0.1:5001 / :8081) actually reach them.
        # The default 127.0.0.1 binding only accepts container-loopback traffic,
        # which Docker's port-forward (arriving on the bridge interface) can't hit.
        # Still safe: ports are published to host 127.0.0.1 only, and DHT/Swarm
        # are disabled, so nothing is exposed to the network.
        ipfs config Addresses.API /ip4/0.0.0.0/tcp/5001
        ipfs config Addresses.Gateway /ip4/0.0.0.0/tcp/8080
        exec ipfs daemon --migrate=true --routing=none
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: forge-e2e-rustfs
    restart: unless-stopped
    environment:
      # The fixture key the tests and e2e scripts sign with (the old MinIO root pair).
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:9000:9000" # S3 API (localhost only)
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  s3-init:
    image: amazon/aws-cli:2.37.4@sha256:fdd8d1fcbea9c371678dee5a40df8b178c7a781b4586605756ee28114c97ead6
    container_name: forge-e2e-s3-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
    # Idempotent: an existing bucket is kept, the policy and CORS puts replace what is
    # there. CORS AllowedHeaders is ["*"], not ["Range"]: browsers send a lowercase
    # `range`, and some stores match the list case-sensitively.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for b in forge-packs forge-byo; do
          aws s3api head-bucket --bucket "$$b" 2>/dev/null || aws s3api create-bucket --bucket "$$b"
        done
        aws s3api put-bucket-policy --bucket forge-packs --policy '{"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Principal":"*","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::forge-packs/*"]},
          {"Effect":"Allow","Principal":"*","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::forge-packs"]}]}'
        aws s3api put-bucket-policy --bucket forge-byo --policy '{"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::forge-byo/*"]}]}'
        aws s3api put-bucket-cors --bucket forge-byo --cors-configuration '{"CORSRules":[
          {"AllowedOrigins":["*"],"AllowedMethods":["GET","HEAD","PUT","DELETE"],"AllowedHeaders":["*"],
           "ExposeHeaders":["ETag","Content-Length","Content-Range"],"MaxAgeSeconds":3600}]}'
        echo 'forge-packs (public read+write) and forge-byo (SigV4 write, public read, CORS *) buckets ready'
    restart: "no"

  static-http:
    image: nginx:alpine
    container_name: forge-e2e-static-http
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./static-fixtures:/usr/share/nginx/html:ro
      - ./nginx-static.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  kubo-data:
  rustfs-data:
