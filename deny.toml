# cargo-deny policy, run by the `cargo-deny` job in .github/workflows/security.yml.
#
#   cargo deny check            # all checks
#   cargo deny check licenses   # one check
#
# The Dash Platform SDK is a pinned git dependency, so the tree is large; the allow lists
# below were generated from what the workspace actually resolves, not from a template.

[graph]
# Only the targets we ship. Platform-specific crates (windows-*, wasm) for other targets
# would otherwise add licences and advisories that never reach a build.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# RustSec database. A vulnerability, an unmaintained crate or a yanked version fails the job.
version = 2
yanked = "deny"
ignore = [
    # rsa (Marvin attack, timing side channel in PKCS#1 v1.5 decryption). No fixed release
    # exists. It arrives through the `pgp` crate, which forge-core uses only to VERIFY OpenPGP
    # signatures with a public key (rules/signature.rs); no RSA private-key operation is done.
    { id = "RUSTSEC-2023-0071", reason = "no fix available; only public-key signature verification reaches rsa through pgp" },

    # zip 8.x, extraction only (SUID bits, symlink targets, permissions through symlinks); no 8.x release fixes
    # them. Two users: forge-runner, which only writes archives (ZipWriter; ZipArchive in a test, never
    # extract), and tenderdash-proto-compiler, a build-time dependency of the Platform SDK that extracts the
    # tenderdash proto archive of the release it pins. Remove when the SDK moves to zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "zip extract only: forge-runner never extracts; the SDK's build script extracts a pinned upstream archive" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract only: forge-runner never extracts; the SDK's build script extracts a pinned upstream archive" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract only: forge-runner never extracts; the SDK's build script extracts a pinned upstream archive" },

    # zvariant, zvariant_derive and zbus_names: "unmaintained" notices (not vulnerabilities), published
    # 2026-10-17. The crates were merged into zbus 6.0 and the standalone ones are frozen. They reach us
    # through keyring 4.2 -> zbus-secret-service-keyring-store -> secret-service 5.2 -> zbus 5.19, the Linux
    # Secret Service path of forge_core::keychain (macOS uses /usr/bin/security and does not link them).
    # zvariant and zbus_names are runtime code on that path; zvariant_derive is a proc-macro, build time
    # only. No known flaw, only no future fixes. Every release of keyring, secret-service and zbus-secret-
    # service-keyring-store is still on zbus 5, so no lockfile update clears it. Revisit when keyring
    # moves to zbus 6; remove these three then.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus 6); Linux keyring path only, no known flaw, no zbus 6 keyring yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6); Linux keyring path only, no known flaw, no zbus 6 keyring yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (merged into zbus 6); proc-macro at build time, no known flaw, no zbus 6 keyring yet" },

    # crypto-bigint 0.5.5, secret-dependent branches in "constant-time" arithmetic (published 2026-10-23).
    # Fixed only in 0.7.6; the 0.5 and 0.6 lines get no release. 0.5 is the bigint of the whole RustCrypto
    # elliptic-curve 0.13 generation, and three users hold us there: the Platform SDK at its pinned tag
    # (dashcore -> blsful -> blstrs_plus, and vsss-rs; BLS is only used to verify quorum signatures, identity
    # keys are signed with libsecp256k1, which is C), pgp (signature verification with public keys only,
    # rules/signature.rs) and web-push-native 0.5, the latest release, still on p256 0.13. The last one is
    # the reachable path: forge-notify signs its VAPID JWT (ES256) and makes the per-message ECDH key with
    # p256 0.13, whose scalar arithmetic (sub_mod) is crypto-bigint 0.5. Exploiting it needs fine timing or
    # microarchitectural observation of the notify host while it signs; the key at stake is the service's
    # VAPID key (it can send pushes to subscribers, nothing else). Remove when web-push-native moves to p256
    # 0.14 and the SDK to elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 has no fix; held by the pinned SDK (BLS verify), pgp (verify) and web-push-native's p256 0.13 (forge-notify VAPID key)" },
]

[licenses]
version = 2
# The licences the workspace actually ships. Anything else fails the job until reviewed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",                # quoted_printable (via lettre)
    "BSL-1.0",             # lhash (via tenderdash-abci)
    "CDLA-Permissive-2.0", # webpki-roots: the Mozilla root store data
    "MITNFA",              # hex_lit (via dashcore): MIT with a no-false-attribution clause
]
confidence-threshold = 0.9
exceptions = []

# Crates whose manifest declares no licence field. Each lives in a dashpay repository whose
# licence is stated in the comment above its entries; cargo-deny cannot read the repository
# licence, so the expression is declared here. Re-check these when the Platform tag moves
# (the entries are keyed by crate name, so they keep applying across versions).

# dashpay/platform: MIT (LICENSE.md at the repository root).
[[licenses.clarify]]
crate = "dash-platform-macros"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "dash-sdk"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "dpp"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "drive-proof-verifier"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "json-schema-compatibility-validator"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "rs-dapi-client"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "simple-signer"
expression = "MIT"
license-files = []

# dashpay/rs-tenderdash-abci: its sibling crates tenderdash-abci and tenderdash-proto declare
# Apache-2.0 in their manifests; this build-time compiler crate omits the field.
[[licenses.clarify]]
crate = "tenderdash-proto-compiler"
expression = "Apache-2.0"
license-files = []

# dashpay/rs-bip37-bloom-filter: MIT (LICENSE at the repository root).
[[licenses.clarify]]
crate = "bip37-bloom-filter"
expression = "MIT"
license-files = []

[bans]
# Duplicate versions are common in the SDK's dependency tree and are not a security signal.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git dependencies are allowed only from the dashpay organisation: the Platform SDK pinned by
# tag in the root Cargo.toml, plus the repositories the SDK itself pulls in (their revisions
# are pinned in Cargo.lock). A new git source anywhere else fails the job.
allow-git = [
    "https://github.com/dashpay/agora-blsful",
    "https://github.com/dashpay/grovedb",
    "https://github.com/dashpay/jsonschema-rs",
    "https://github.com/dashpay/platform",
    "https://github.com/dashpay/rs-bip37-bloom-filter",
    "https://github.com/dashpay/rs-tenderdash-abci",
    "https://github.com/dashpay/rust-dashcore",
    "https://github.com/dashpay/vsss-rs",
]
