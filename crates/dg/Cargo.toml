[package]
name = "dg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "dg — the gh-shaped command-line interface for Dash Forge."

[[bin]]
name = "dg"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core" }
anyhow.workspace = true
clap.workspace = true
clap_complete = "4"
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true }
serde_json.workspace = true
toml = "0.8"
hex = "0.4"
# `dg storage test` drives the storage probes over the same rustls client forge-core uses.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# `dg pr merge` builds the merge in a throwaway repository.
tempfile = "3"

# `cargo binstall` fetches the prebuilt release archive instead of compiling (release.yml
# publishes dash-forge-<version>-<target>.{tar.gz,zip}; the binaries sit in a top-level
# dash-forge-<version>-<target>/ directory). Keep in step with crates/git-remote-dash.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dash-forge-{ version }-{ target }.tar.gz"
bin-dir = "dash-forge-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/dash-forge-{ version }-{ target }.zip"
pkg-fmt = "zip"

[lints]
workspace = true
