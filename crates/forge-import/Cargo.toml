[package]
name = "forge-import"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "forge-import — mirror GitHub repositories and GitLab projects into Dash Forge."

[lib]
path = "src/lib.rs"

[[bin]]
name = "forge-import"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core", features = ["cli-logging"] }
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
hex = "0.4"
sha2 = "0.10"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
# Paused time for the pipeline tests (`#[tokio::test(start_paused = true)]`).
tokio = { workspace = true, features = ["time", "test-util"] }

[lints]
workspace = true
