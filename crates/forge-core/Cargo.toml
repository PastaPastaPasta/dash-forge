[package]
name = "forge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared library for Dash Forge: platform client, pack pipeline, backends, rules, cost and keystore."

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# pack pipeline (git object/pack handling, hashing, compression)
sha2 = "0.10"
sha1 = "0.10"
flate2 = "1"
hex = "0.4"
glob-match = "0.2"

# storage profiles (`~/.config/dash-forge/storage.toml`) + AWS SigV4 request signing.
# hmac 0.12 shares sha2's digest 0.10, so no second RustCrypto stack is pulled in.
toml = "0.8"
hmac = "0.12"

# private repositories (docs/security/private-repos.md §10): AES-256-GCM with the segment nonce
# built by hand (not aead::stream), HKDF-SHA256 subkeys, constant-time comparisons, key material
# zeroized on drop, and the OS CSPRNG for epoch keys and the rnd(32) hedge inputs.
aes-gcm = { version = "0.10", features = ["zeroize"] }
hkdf = "0.12"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
getrandom = "0.2"

# storage backends (HTTP/S3/IPFS adapters). reqwest on rustls (no system OpenSSL);
# multipart for the kubo `/api/v0/add` upload. async-trait keeps `PackBackend`
# object-safe (heterogeneous backends behind `dyn` in the failover registry);
# futures drives the ≤2-parallel reader race and the window-8 platform pipeline.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart"] }
async-trait = "0.1"
futures = "0.3"
# `time` only — the bounded read-after-write verify polls (tokens.rs) sleep between
# re-reads on the caller's tokio runtime (the SDK's broadcast_and_wait already needs one).
tokio = { workspace = true, features = ["time"] }

# Dash Platform SDK — confined to `forge-core::platform` per style-guide §B.
dash-sdk.workspace = true
dapi-grpc.workspace = true
drive-proof-verifier.workspace = true
rs-sdk-trusted-context-provider.workspace = true
simple-signer.workspace = true

# Only for `vendored-openssl` below. rs-sdk-trusted-context-provider enables reqwest's default
# (native-tls) features, which on Linux link the system OpenSSL; this lets a release build
# compile OpenSSL in statically instead.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", optional = true }

[features]
# Fault-injection environment hooks for the e2e harness (DASH_FORGE_KILL_AFTER_CHUNK).
# Off in normal builds; enabled through git-remote-dash's `test-hooks`.
test-hooks = []
# Statically link a vendored OpenSSL on Linux, so release binaries do not depend on the
# host's libssl version (release.yml builds with it; dev builds use the system library).
# No effect on macOS/Windows, where native-tls uses the OS TLS stack.
vendored-openssl = ["dep:openssl", "openssl/vendored"]
# The deterministic seal constructors (caller-supplied nonce / fileId) that reproduce the
# conformance vectors. Release builds never set it; the crate's own tests get them via cfg(test).
vectors = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
hex = "0.4"
serde_json = { workspace = true }

[lints]
workspace = true
