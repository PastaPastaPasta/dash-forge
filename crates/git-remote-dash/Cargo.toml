[package]
name = "git-remote-dash"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "git remote helper for dash:// URLs (git remote-dash)."

[[bin]]
name = "git-remote-dash"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["time"] }
serde_json.workspace = true
hex = "0.4"
futures = "0.3"

[features]
# Fault-injection environment hooks for the e2e harness (DASH_FORGE_FAIL_BEFORE_REFS,
# DASH_FORGE_KILL_AFTER_CHUNK). Off in normal builds so a stray variable can never
# interrupt a real push; `make storage-e2e` builds with it.
test-hooks = ["forge-core/test-hooks"]

[dev-dependencies]
tempfile = "3"

# `cargo binstall` fetches the prebuilt release archive instead of compiling; the same
# archive as crates/dg (release.yml), from which only this crate's binary is installed.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dash-forge-{ version }-{ target }.tar.gz"
bin-dir = "dash-forge-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/dash-forge-{ version }-{ target }.zip"
pkg-fmt = "zip"

[lints]
workspace = true
