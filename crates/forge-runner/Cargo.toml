[package]
name = "forge-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "forge-runner — run a Dash Forge repo's .forge/workflows with nektos/act and report check runs."

[[bin]]
name = "forge-runner"
path = "src/main.rs"

# No forge-core (and so no Platform SDK) here: the runner drives the tools a user already has,
# `git` with `git-remote-dash` for `dash://` and `dg ci report` for check runs, and `act`.
[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
yaml_serde = "0.10"
sha2 = "0.10"
hex = "0.4"
# Relay wake-ups (`[relay]`): a signed long-poll over http(s).
hmac = "0.12"
ureq = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
