name: Feature request
description: Suggest something Forge should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. If GitHub or another forge already does it well, say how.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
