name: Deploy forge-web to Pages

# The hosted build (forge.dashhq.org) targets devnet sakura: forge-v2 needs Platform
# protocol 14, which only the devnet runs today. The network is a build-time choice
# (NEXT_PUBLIC_NETWORK / NEXT_PUBLIC_DEVNET_NAME); override it with the repository variables
# PAGES_NETWORK / PAGES_DEVNET_NAME (e.g. PAGES_NETWORK=testnet once forge-v2 is deployed
# there) without editing this file. The header badge names the network the build reads.
#
# The "devnet is moving" notice (docs/guides/devnet-move.md) is switched the same way, with the
# repository variable PAGES_DEVNET_NOTICE: unset (no banner), `upcoming` (a dismissible banner on
# every page) or `moving` (a banner that stays, and writes are paused: the window before the build
# for the new devnet). `moving` only applies to a build for a devnet whose deployment file is marked
# `retired` (lib/devnet-notice.ts), so leaving it set cannot pause writes on the devnet Forge moved
# to (sakura). Changing the variable takes effect on the next deploy
# (re-run this workflow, or push to master); any other value fails the build. A tab opened before
# the deploy keeps running the old build until it is reloaded, so it will not show the notice yet.

on:
  push:
    branches: [master]
    paths:
      - 'forge-web/**'
      # Bundled into the web app: lib/deployments.ts imports the per-network contract ids.
      - 'forge-contracts/deployments/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Per job (below): the build runs third-party npm code, so it gets no token that can deploy or
# attest.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: forge-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build (${{ vars.PAGES_NETWORK || 'devnet' }})
        env:
          NEXT_PUBLIC_NETWORK: ${{ vars.PAGES_NETWORK || 'devnet' }}
          NEXT_PUBLIC_DEVNET_NAME: ${{ (vars.PAGES_NETWORK || 'devnet') == 'devnet' && (vars.PAGES_DEVNET_NAME || 'sakura') || '' }}
          # Empty when the variable is unset: no notice.
          NEXT_PUBLIC_DEVNET_NOTICE: ${{ vars.PAGES_DEVNET_NOTICE }}
          # The /mirror wizard pins the Mirror Action and its binaries to the commit deployed.
          FORGE_BUILD_COMMIT: ${{ github.sha }}
        run: pnpm build
      # `pnpm build` wrote out/forge-manifest.json: every file of this build with its SHA-256
      # (the previous builds' chunks merged in below are not in it). The attest job signs it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-manifest
          path: forge-web/out/forge-manifest.json
          if-no-files-found: error
          retention-days: 7
      # Deploy skew: a tab opened before this deploy still runs the previous build and lazily
      # loads that build's chunks (the Platform SDK, the sign-in flows). Those files must stay
      # up or the tab breaks mid-session. So the chunks of the last two builds are merged into
      # this artifact (hashed names: nothing is overwritten), kept between runs in the Actions
      # cache (master-scoped; pages-static-keepalive.yml restores it weekly so a quiet week
      # does not let GitHub evict it). Bounded: a generation is skipped when the merged site
      # would pass MAX_SITE_MB (Pages publishes at most 1 GB). A tab on an older build still does
      # one full page load on its next navigation (Next compares build ids), which keeps the
      # signed-in session.
      - name: Restore the previous builds' static chunks
        uses: actions/cache/restore@v4
        with:
          path: forge-web/.pages-static
          key: pages-static-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-static-
      - name: Keep the previous builds' static chunks
        env:
          MAX_SITE_MB: 700
        run: |
          set -euo pipefail
          own="$(mktemp -d)"
          cp -R out/_next/static/. "$own/"
          # A cached generation is merged into the served origin, so only what a Next build emits
          # is accepted: regular files (no symlinks, devices or fifos), under chunks/, css/,
          # media/, wasm/ or one <buildId>/ holding only its manifests, with plain names. Any
          # other shape skips that generation (the deploy goes on without it).
          valid_gen() {
            local d="$1"
            # The generation itself must be a real directory (find does not descend a symlink).
            if [ -L "$d" ] || [ ! -d "$d" ]; then echo "not a plain directory"; return 1; fi
            if [ -n "$(find "$d/" -mindepth 1 ! -type f ! -type d -print -quit)" ]; then echo "non-regular file"; return 1; fi
            if [ -n "$(find "$d/" -mindepth 1 -name '.*' -print -quit)" ]; then echo "hidden entry"; return 1; fi
            if [ -n "$(find "$d/" -mindepth 1 -print | LC_ALL=C grep -Ev '/[A-Za-z0-9_@~-][A-Za-z0-9._@~-]*$' | head -1)" ]; then echo "unexpected name"; return 1; fi
            local top
            for top in "$d"/*; do
              local name; name="$(basename "$top")"
              case "$name" in
                chunks|css|media|wasm) [ -d "$top" ] || { echo "$name is not a directory"; return 1; } ;;
                *)
                  [ -d "$top" ] || { echo "stray file $name"; return 1; }
                  if [ -n "$(find "$top/" -mindepth 1 ! -name _buildManifest.js ! -name _ssgManifest.js -print -quit)" ]; then echo "unexpected content in $name/"; return 1; fi
                  ;;
              esac
            done
            if [ -n "$(find "$d/" -type f ! -name '*.js' ! -name '*.css' ! -name '*.wasm' ! -name '*.woff' ! -name '*.woff2' -print -quit)" ]; then echo "unexpected file type"; return 1; fi
          }
          # Nothing restored from the cache may be a symlink, anywhere.
          if [ -e .pages-static ] && { [ -L .pages-static ] || [ -n "$(find .pages-static/ -type l -print -quit)" ]; }; then
            echo "::warning::the cached static chunks hold a symlink; not keeping any"
            rm -rf .pages-static
          fi
          for gen in 1 2; do
            src=".pages-static/gen$gen"
            [ -e "$src" ] || continue
            if ! why="$(valid_gen "$src")"; then
              echo "::warning::not keeping build gen$gen's chunks: $why"
              rm -rf "$src"
              continue
            fi
            site_mb=$(du -sm out | cut -f1)
            gen_mb=$(du -sm "$src" | cut -f1)
            if [ $((site_mb + gen_mb)) -gt "$MAX_SITE_MB" ]; then
              echo "::warning::not keeping build gen$gen's chunks: ${site_mb} MB + ${gen_mb} MB passes ${MAX_SITE_MB} MB"
              continue
            fi
            cp -R "$src/." out/_next/static/
            echo "kept build gen$gen's chunks (${gen_mb} MB)"
          done
          # Hashed names never collide with different content; re-copy this build's own files
          # last anyway, so nothing of it is ever replaced by an older copy.
          cp -R "$own/." out/_next/static/
          # Next run: this build becomes gen1, the previous one gen2 (older ones drop out).
          rm -rf .pages-static/gen2
          if [ -d .pages-static/gen1 ]; then mv .pages-static/gen1 .pages-static/gen2; fi
          mkdir -p .pages-static
          mv "$own" .pages-static/gen1
          du -sh out .pages-static
      - name: Save this build's static chunks
        uses: actions/cache/save@v4
        with:
          path: forge-web/.pages-static
          key: pages-static-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: forge-web/out

  # The build manifest's provenance attestation: what `dg verify-app` and the app's own check
  # look up (a manifest GitHub never attested is not a build of this repository,
  # docs/guides/verify-the-app.md). In its own job, which runs no build tooling, and only for
  # master: a build dispatched from another branch is never attested.
  attest:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore OIDC token for the attestation
      attestations: write # store it in this repository
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: forge-manifest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: forge-manifest.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # forge.dashhq.org sits behind Cloudflare, whose Web Analytics injects a beacon script
      # that the page's CSP refuses (a console error on every page; QW3-040). That is a zone
      # setting this repository cannot change, so this only reports it (docs/dev/hosting.md §6).
      - name: Check the live page for an injected third-party script
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # A fresh deploy can take a moment to answer: retry on any error, not just timeouts.
          if ! html="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -H 'Accept: text/html' -H 'User-Agent: Mozilla/5.0' "$PAGE_URL")"; then
            echo "::warning title=Beacon check skipped::could not fetch $PAGE_URL to look for an injected analytics beacon"
            exit 0
          fi
          if printf '%s' "$html" | grep -q -i -E 'cloudflareinsights|data-cf-beacon'; then
            echo "::warning title=Cloudflare Web Analytics beacon injected::$PAGE_URL serves a Cloudflare Web Analytics script that the page CSP blocks. Turn automatic setup off on the zone: docs/dev/hosting.md section 6."
          else
            echo "No injected analytics beacon on $PAGE_URL"
          fi
