name: Deploy forge-web to Pages

# The hosted build (forge.dashhq.org) targets testnet, where forge-v2 (Platform protocol 14) is
# registered. The network is a build-time choice (NEXT_PUBLIC_NETWORK / NEXT_PUBLIC_DEVNET_NAME);
# override it with the repository variables PAGES_NETWORK / PAGES_DEVNET_NAME (PAGES_NETWORK=devnet
# needs PAGES_DEVNET_NAME) without editing this file. The header badge names the network the build
# reads.
#
# The "devnet is moving" notice (docs/archive/devnet-move.md) is switched the same way, with the
# repository variable PAGES_DEVNET_NOTICE: unset (no banner), `upcoming` (a dismissible banner on
# every page) or `moving` (a banner that stays, and writes are paused: the window before the build
# for the new devnet). `moving` only applies to a build for a devnet whose deployment file is marked
# `retired` (lib/devnet-notice.ts), so leaving it set cannot pause writes on a live network. A
# testnet or mainnet build ignores both. PAGES_DEVNET_MOVE_TO (`testnet`, `mainnet` or `devnet-<name>`) names where an
# `upcoming` move goes. Changing the variable takes effect on the next deploy
# (run this workflow on master, or push to master); any other value fails the build. A tab opened before
# the deploy keeps running the old build until it is reloaded, so it will not show the notice yet.
#
# Changing the network the live site serves (testnet -> mainnet, or back) is never automatic: set
# PAGES_NETWORK, then run this workflow by workflow_dispatch with confirm_network set to the same
# network. A push that would change it fails at the network guard, and a testnet or mainnet build
# fails there while that network's deployment record is incomplete (docs/launch/mainnet-runbook.md).
# PAGES_SITE_URL (default https://forge.dashhq.org) is where the guard reads the live network.
#
# The operator's switch works on every network (docs/hosting.md, "Pausing the site"): the
# repository variable PAGES_NOTICE is unset (nothing), `advisory` (a banner that cannot be
# dismissed, linking the advisory) or `paused` (the banner, and every write refused before anything
# is signed). PAGES_NOTICE_TEXT is the reason shown, PAGES_NOTICE_URL the advisory's https address.
# Set them, then run this workflow by workflow_dispatch; a typo fails the build.
#
# The optional services are switched on the same way, and stay hidden while their variable is
# unset (docs/hosting/forge-gateway.md, docs/hosting/forge-notify.md): PAGES_GATEWAY_URL (and
# PAGES_GATEWAY_LABEL) adds the HTTPS clone row of a forge-gateway, and PAGES_NOTIFY_URL adds
# Settings → Notifications → Email and push for a forge-notify. A value that is not a usable URL
# leaves the feature hidden.
#
# The hosted mainnet and testnet builds are separate sites. PAGES_MAINNET_SITE_URL and
# PAGES_TESTNET_SITE_URL (https origins, such as https://forge.dashhq.org) let each point at the
# other: the Networks page links a live network's site, a test network's build shows a dismissible
# "Forge is live on mainnet" banner once the bundled mainnet record has Forge's contracts, and the
# mainnet build's footer links the testnet site. A value that is not an https origin is ignored.

on:
  push:
    branches: [master]
    paths:
      - 'forge-web/**'
      # Bundled into the web app: the /docs hub renders docs/ at build time (forge-web/lib/docs).
      - 'docs/**'
      # Bundled into the web app: lib/deployments.ts imports the per-network contract ids.
      - 'forge-contracts/deployments/**'
      # Bundled into the web app: lib/view/curation.ts imports the hosted curation list, so an
      # edit to it deploys (docs/hosted-curation.md).
      - 'forge-contracts/config/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      confirm_network:
        description: 'Required when this deploy changes the network the live site serves (e.g. mainnet). Type the network PAGES_NETWORK names.'
        required: false
        default: ''

# Per job (below): the build runs third-party npm code, so it gets no token that can deploy or
# attest.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: forge-web/pnpm-lock.yaml
      # The network gate (forge-contracts/scripts/pages-network-guard.mjs): a testnet or mainnet
      # build needs that network's record complete, and a deploy that changes the network the live
      # site serves runs only by workflow_dispatch with confirm_network set to it.
      - name: Network guard
        working-directory: .
        env:
          PAGES_BUILD_NETWORK: ${{ vars.PAGES_NETWORK || 'testnet' }}
          PAGES_DEVNET_NAME: ${{ vars.PAGES_NETWORK == 'devnet' && vars.PAGES_DEVNET_NAME || '' }}
          PAGES_EVENT: ${{ github.event_name }}
          PAGES_CONFIRM: ${{ inputs.confirm_network }}
          PAGES_SITE_URL: ${{ vars.PAGES_SITE_URL || 'https://forge.dashhq.org' }}
        run: node forge-contracts/scripts/pages-network-guard.mjs
      - run: pnpm install --frozen-lockfile
      - name: Build (${{ vars.PAGES_NETWORK || 'testnet' }})
        env:
          NEXT_PUBLIC_NETWORK: ${{ vars.PAGES_NETWORK || 'testnet' }}
          NEXT_PUBLIC_DEVNET_NAME: ${{ vars.PAGES_NETWORK == 'devnet' && vars.PAGES_DEVNET_NAME || '' }}
          # Unset (below) when the variable is: no notice.
          NEXT_PUBLIC_DEVNET_NOTICE: ${{ vars.PAGES_DEVNET_NOTICE }}
          NEXT_PUBLIC_DEVNET_MOVE_TO: ${{ vars.PAGES_DEVNET_MOVE_TO }}
          NEXT_PUBLIC_PAGES_NOTICE: ${{ vars.PAGES_NOTICE }}
          NEXT_PUBLIC_PAGES_NOTICE_TEXT: ${{ vars.PAGES_NOTICE_TEXT }}
          NEXT_PUBLIC_PAGES_NOTICE_URL: ${{ vars.PAGES_NOTICE_URL }}
          # Unset (below) when the variable is: no HTTPS clone row, no email and push settings.
          NEXT_PUBLIC_GATEWAY_URL: ${{ vars.PAGES_GATEWAY_URL }}
          NEXT_PUBLIC_GATEWAY_LABEL: ${{ vars.PAGES_GATEWAY_LABEL }}
          NEXT_PUBLIC_NOTIFY_URL: ${{ vars.PAGES_NOTIFY_URL }}
          # Unset (below) when the variable is: no link to the other network's site.
          NEXT_PUBLIC_MAINNET_SITE_URL: ${{ vars.PAGES_MAINNET_SITE_URL }}
          NEXT_PUBLIC_TESTNET_SITE_URL: ${{ vars.PAGES_TESTNET_SITE_URL }}
          # Cloudflare Web Analytics (forge-web/lib/cf-beacon.ts, docs/hosting.md §6): the page
          # carries the beacon so the zone's automatic injection stays off. The site token is
          # public (it is in every page). A fork's deploy gets none unless it sets the variable.
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.PAGES_CF_BEACON_TOKEN || (github.repository == 'PastaPastaPasta/dash-forge' && '87b4d7fbbb4f476895825bf0e361acb6' || '') }}
          # The /mirror wizard pins the Mirror Action and its binaries to the commit deployed.
          FORGE_BUILD_COMMIT: ${{ github.sha }}
        # An unset repository variable arrives as an empty string, which Next would inline as "".
        # Unset those instead, so the bytes match a rebuild that leaves them out
        # (docs/guides/verify-the-app.md). That includes NEXT_PUBLIC_DEVNET_NAME, empty on every
        # network but a devnet.
        run: |
          for v in NEXT_PUBLIC_DEVNET_NAME NEXT_PUBLIC_DEVNET_NOTICE NEXT_PUBLIC_DEVNET_MOVE_TO NEXT_PUBLIC_PAGES_NOTICE NEXT_PUBLIC_PAGES_NOTICE_TEXT NEXT_PUBLIC_PAGES_NOTICE_URL NEXT_PUBLIC_GATEWAY_URL NEXT_PUBLIC_GATEWAY_LABEL NEXT_PUBLIC_NOTIFY_URL NEXT_PUBLIC_MAINNET_SITE_URL NEXT_PUBLIC_TESTNET_SITE_URL NEXT_PUBLIC_CF_BEACON_TOKEN; do
            [ -n "${!v}" ] || unset "$v"
          done
          # A gateway on another network would hand out clone lines for that network's repos.
          node scripts/check-gateway-network.mjs
          pnpm build
      # RFC 9116 security.txt: public/.well-known/security.txt must reach the export, and from
      # there the Pages artifact. actions/upload-pages-artifact@v3 (used below) archives dot
      # directories; v4 leaves dotfiles out, which would silently drop this file, and v5 and later
      # keep them only with `include-hidden-files: true`. Moving that action past v3 needs that.
      - name: Check the export publishes .well-known/security.txt
        run: |
          test -s out/.well-known/security.txt || { echo "::error::out/.well-known/security.txt is missing from the export"; exit 1; }
          grep -q '^Contact: ' out/.well-known/security.txt || { echo "::error::security.txt has no Contact field"; exit 1; }
          grep -q '^Expires: ' out/.well-known/security.txt || { echo "::error::security.txt has no Expires field"; exit 1; }
          grep -q '"\.well-known/security\.txt"' out/forge-manifest.json || { echo "::error::forge-manifest.json does not list .well-known/security.txt"; exit 1; }
      # The third-party license notices (scripts/third-party-licenses.mjs, run by `pnpm build`,
      # which fails on a gap) must reach the Pages artifact: the OpenPGP.js LGPL notice and the
      # GPL and LGPL texts are served from here.
      - name: Check the export publishes the license notices
        run: |
          for f in third-party-licenses.txt wasm-sdk-licenses.txt licenses/index.html licenses/LGPL-3.0.txt licenses/GPL-3.0.txt; do
            test -s "out/$f" || { echo "::error::out/$f is missing from the export"; exit 1; }
            grep -q "\"$f\"" out/forge-manifest.json || { echo "::error::forge-manifest.json does not list $f"; exit 1; }
          done
          grep -q 'OpenPGP.js' out/third-party-licenses.txt || { echo "::error::third-party-licenses.txt has no OpenPGP.js notice"; exit 1; }
      # `pnpm build` wrote out/forge-manifest.json: every file of this build with its SHA-256
      # (the previous builds' chunks merged in below are not in it). The attest job signs it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-manifest
          path: forge-web/out/forge-manifest.json
          if-no-files-found: error
          retention-days: 7
      # Deploy skew: a tab opened before this deploy still runs the previous build and lazily
      # loads that build's chunks (the Platform SDK, the sign-in flows). Those files must stay
      # up or the tab breaks mid-session. So the chunks of the last two builds are merged into
      # this artifact (hashed names: nothing is overwritten), kept between runs in the Actions
      # cache (master-scoped; pages-static-keepalive.yml restores it weekly so a quiet week
      # does not let GitHub evict it). Bounded: a generation is skipped when the merged site
      # would pass MAX_SITE_MB (Pages publishes at most 1 GB). A tab on an older build still does
      # one full page load on its next navigation (Next compares build ids), which keeps the
      # signed-in session.
      - name: Restore the previous builds' static chunks
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: forge-web/.pages-static
          key: pages-static-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-static-
      - name: Keep the previous builds' static chunks
        env:
          MAX_SITE_MB: 700
        run: |
          set -euo pipefail
          own="$(mktemp -d)"
          cp -R out/_next/static/. "$own/"
          # A cached generation is merged into the served origin, so only what a Next build emits
          # is accepted: regular files (no symlinks, devices or fifos), under chunks/, css/,
          # media/, wasm/ or one <buildId>/ holding only its manifests, with plain names. Any
          # other shape skips that generation (the deploy goes on without it).
          valid_gen() {
            local d="$1"
            # The generation itself must be a real directory (find does not descend a symlink).
            if [ -L "$d" ] || [ ! -d "$d" ]; then echo "not a plain directory"; return 1; fi
            if [ -n "$(find "$d/" -mindepth 1 ! -type f ! -type d -print -quit)" ]; then echo "non-regular file"; return 1; fi
            if [ -n "$(find "$d/" -mindepth 1 -name '.*' -print -quit)" ]; then echo "hidden entry"; return 1; fi
            if [ -n "$(find "$d/" -mindepth 1 -print | LC_ALL=C grep -Ev '/[A-Za-z0-9_@~-][A-Za-z0-9._@~-]*$' | head -1)" ]; then echo "unexpected name"; return 1; fi
            local top
            for top in "$d"/*; do
              local name; name="$(basename "$top")"
              case "$name" in
                chunks|css|media|wasm) [ -d "$top" ] || { echo "$name is not a directory"; return 1; } ;;
                *)
                  [ -d "$top" ] || { echo "stray file $name"; return 1; }
                  if [ -n "$(find "$top/" -mindepth 1 ! -name _buildManifest.js ! -name _ssgManifest.js -print -quit)" ]; then echo "unexpected content in $name/"; return 1; fi
                  ;;
              esac
            done
            if [ -n "$(find "$d/" -type f ! -name '*.js' ! -name '*.css' ! -name '*.wasm' ! -name '*.woff' ! -name '*.woff2' -print -quit)" ]; then echo "unexpected file type"; return 1; fi
          }
          # Nothing restored from the cache may be a symlink, anywhere.
          if [ -e .pages-static ] && { [ -L .pages-static ] || [ -n "$(find .pages-static/ -type l -print -quit)" ]; }; then
            echo "::warning::the cached static chunks hold a symlink; not keeping any"
            rm -rf .pages-static
          fi
          for gen in 1 2; do
            src=".pages-static/gen$gen"
            [ -e "$src" ] || continue
            if ! why="$(valid_gen "$src")"; then
              echo "::warning::not keeping build gen$gen's chunks: $why"
              rm -rf "$src"
              continue
            fi
            site_mb=$(du -sm out | cut -f1)
            gen_mb=$(du -sm "$src" | cut -f1)
            if [ $((site_mb + gen_mb)) -gt "$MAX_SITE_MB" ]; then
              echo "::warning::not keeping build gen$gen's chunks: ${site_mb} MB + ${gen_mb} MB passes ${MAX_SITE_MB} MB"
              continue
            fi
            cp -R "$src/." out/_next/static/
            echo "kept build gen$gen's chunks (${gen_mb} MB)"
          done
          # Hashed names never collide with different content; re-copy this build's own files
          # last anyway, so nothing of it is ever replaced by an older copy.
          cp -R "$own/." out/_next/static/
          # Next run: this build becomes gen1, the previous one gen2 (older ones drop out).
          rm -rf .pages-static/gen2
          if [ -d .pages-static/gen1 ]; then mv .pages-static/gen1 .pages-static/gen2; fi
          mkdir -p .pages-static
          mv "$own" .pages-static/gen1
          du -sh out .pages-static
      - name: Save this build's static chunks
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: forge-web/.pages-static
          key: pages-static-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: forge-web/out

  # The build manifest's provenance attestation: what `dg verify-app` and the app's own check
  # look up (a manifest GitHub never attested is not a build of this repository,
  # docs/guides/verify-the-app.md). In its own job, which runs no build tooling, and only for
  # master: a build dispatched from another branch is never attested.
  attest:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore OIDC token for the attestation
      attestations: write # store it in this repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: forge-manifest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: forge-manifest.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      # The deployed site must serve security.txt (RFC 9116): a dot directory can be lost between
      # the export and the artifact. Reports only, like the check below: the deploy has happened.
      - name: Check the live site serves .well-known/security.txt
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          url="${PAGE_URL%/}/.well-known/security.txt"
          if ! body="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -H 'User-Agent: Mozilla/5.0' "$url")"; then
            echo "::warning title=security.txt not served::$url did not answer"
            exit 0
          fi
          if printf '%s' "$body" | grep -q '^Contact: '; then
            echo "$url serves a security.txt"
          else
            echo "::warning title=security.txt malformed::$url has no Contact field"
          fi
      # forge.dashhq.org sits behind Cloudflare. The page carries its own Web Analytics beacon
      # (forge-web/lib/cf-beacon.ts); while the zone's automatic setup is on, Cloudflare injects a
      # second one. `dg verify-app` removes that tag only in Cloudflare's exact form and beside the
      # build's beacon for the same site token. The beacon runs once per page, and the CSP blocks
      # every other beacon URL (docs/hosting.md §6), so this only reports the count.
      - name: Count the live page's analytics beacons
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILT_BEACONS: ${{ (vars.PAGES_CF_BEACON_TOKEN || github.repository == 'PastaPastaPasta/dash-forge') && '1' || '0' }}
        run: |
          # A fresh deploy can take a moment to answer: retry on any error, not just timeouts.
          if ! html="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -H 'Accept: text/html' -H 'User-Agent: Mozilla/5.0' "$PAGE_URL")"; then
            echo "::warning title=Beacon check skipped::could not fetch $PAGE_URL to look for an injected analytics beacon"
            exit 0
          fi
          # Script tags only: the RSC payload holds a JSON copy of the build's own tag.
          served=$(printf '%s' "$html" | grep -o -i '<script[^>]*static\.cloudflareinsights\.com' | wc -l)
          if [ "$served" -gt "$BUILT_BEACONS" ]; then
            if [ "$BUILT_BEACONS" -gt 0 ]; then
              echo "::notice title=Cloudflare Web Analytics beacon injected::$PAGE_URL serves $served Cloudflare Web Analytics beacons; the build has $BUILT_BEACONS. dg verify-app removes the injected one only in Cloudflare's exact form with the build's site token; it is the check (docs/hosting.md section 6)."
            else
              echo "::warning title=Cloudflare Web Analytics beacon injected::$PAGE_URL serves $served Cloudflare Web Analytics beacons and the build has none, so dg verify-app fails. Set the site to JS snippet installation, or build with PAGES_CF_BEACON_TOKEN: docs/hosting.md section 6."
            fi
          else
            echo "No injected analytics beacon on $PAGE_URL ($served, as built)"
          fi
