name: Testnet Nightly

# Nightly certification against LIVE Dash Platform testnet.
#
# The suites this drives are implemented and live in the repo:
#   * forge-web/e2e/          — Playwright: read paths, fallback browse, zero-backend, a11y
#   * e2e/cli/run.sh          — 8 CLI scenarios on devnet moutai (forge-v2): clone/push
#                               round-trip, non-ff, ref delete, revoked-writer push, non-member
#                               push, third-party verify, depth+filter; plus a testnet v1
#                               read-compat clone
#
# They split by what they need:
#   * READ-ONLY specs need only a network path to testnet DAPI and the read fixture repo
#     (seeded by `seed-read-fixture` when the secrets exist; e2e/README.md reserves it), so
#     they run unconditionally and their failure fails this workflow.
#   * The CLI suite and the write specs need FUNDED fixture identities, which cannot live in
#     a fork's PR context. A separate `fixtures` probe job decides whether they run, so when
#     the secrets are absent the suite job's conclusion is literally `skipped` rather than a
#     green job with everything gated out — a distinction any badge or alert rule can see.
#
# Fixture identity secrets (e2e/cli/config.sh names the roles):
#   FORGE_MOUTAI_IDENTITY_OWNER   - owns the forge-v2 e2e-cli repo, adds/removes members
#   FORGE_MOUTAI_IDENTITY_COLLAB  - added as a writer, then removed (scenario 04)
#   FORGE_MOUTAI_IDENTITY_CONTRIB - never a member (scenario 05)
#   FORGE_TEST_IDENTITY_CONTRIB   - any testnet identity, for the v1 read-compat clone (08)
#   FORGE_TEST_IDENTITY_DEPLOYER  - testnet: owns the browser specs' read fixture (v1),
#                                   verified by the seed job
# Each holds the bridge-format identity JSON that `dg` reads from
# ~/.config/dash-forge/test-identities/devnet-moutai/<ROLE>.identity.json (moutai) or
# ~/.config/dash-forge/test-identities/<ROLE>.identity.json (testnet).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: testnet-nightly
  cancel-in-progress: false

jobs:
  web-read-paths:
    name: playwright (read-only, live testnet)
    # Reads the dedicated read fixture (e2e/README.md), so it waits for the seed job — but
    # still runs when that job is skipped (no secrets: the fixture is read as it stands) or
    # failed (the specs then say what is wrong with it).
    needs: seed-read-fixture
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: forge-web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: forge-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # auth-write needs a funded identity; everything else is a read against live testnet.
      # E2E_SKIP_BUILD reuses the `out/` just built — the Playwright webServer would
      # otherwise run `pnpm build` a second time before serving it.
      - name: Playwright read-path + a11y specs
        env:
          E2E_SKIP_BUILD: '1'
        run: pnpm exec playwright test read-paths.spec.ts fallback-browse.spec.ts zero-backend.spec.ts a11y.spec.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: forge-web/e2e/report
          retention-days: 7

  # A separate probe job so the suite job's CONCLUSION is literally `skipped` when the
  # fixtures are absent. Gating the steps inside one job leaves that job green, which is
  # indistinguishable from a real pass to a badge, the checks API, or a "notify on failed
  # nightly" rule — the exact confusion this workflow is meant to remove.
  fixtures:
    name: fixture identities configured?
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.probe.outputs.present }}
      # The read-fixture seeder signs with DEPLOYER alone.
      deployer: ${{ steps.probe.outputs.deployer }}
    steps:
      - name: Probe
        id: probe
        env:
          FORGE_MOUTAI_IDENTITY_OWNER: ${{ secrets.FORGE_MOUTAI_IDENTITY_OWNER }}
          FORGE_MOUTAI_IDENTITY_COLLAB: ${{ secrets.FORGE_MOUTAI_IDENTITY_COLLAB }}
          FORGE_MOUTAI_IDENTITY_CONTRIB: ${{ secrets.FORGE_MOUTAI_IDENTITY_CONTRIB }}
          FORGE_TEST_IDENTITY_CONTRIB: ${{ secrets.FORGE_TEST_IDENTITY_CONTRIB }}
          FORGE_TEST_IDENTITY_DEPLOYER: ${{ secrets.FORGE_TEST_IDENTITY_DEPLOYER }}
        run: |
          if [ -n "$FORGE_TEST_IDENTITY_DEPLOYER" ]; then
            echo "deployer=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployer=false" >> "$GITHUB_OUTPUT"
          fi
          missing=()
          # Report the SECRET names an operator has to create, not internal aliases.
          for name in FORGE_MOUTAI_IDENTITY_OWNER FORGE_MOUTAI_IDENTITY_COLLAB \
                      FORGE_MOUTAI_IDENTITY_CONTRIB FORGE_TEST_IDENTITY_CONTRIB; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### CLI e2e suite skipped"
              echo
              echo "Missing repository secrets: \`${missing[*]}\`."
              echo
              echo "These identities must exist and be funded (moutai; testnet for 08) for the CLI suite"
              echo "to run. The suite job below reports SKIPPED — it is **not** a passing"
              echo "run. See \`e2e/cli/config.sh\` for the role pool and"
              echo "\`docs/testing/e2e-test-plan.md\` for provisioning."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=CLI e2e skipped::missing secrets: ${missing[*]}"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

  # Make the browser specs' read fixture exist and hold exactly the expected commit. It is
  # its own repo, written only by this job, so nothing the CLI suite or an ad-hoc storage run
  # stores can reach what the browser reads (e2e/README.md). Idempotent: a no-op once seeded.
  seed-read-fixture:
    name: seed the read fixture
    needs: fixtures
    if: needs.fixtures.outputs.deployer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ID_DEPLOYER_JSON: ${{ secrets.FORGE_TEST_IDENTITY_DEPLOYER }}
    steps:
      - uses: actions/checkout@v5
      - name: Install protoc
        env:
          PROTOC_VERSION: '28.3'
        run: |
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-cli
      - name: Materialize the DEPLOYER identity
        run: |
          dir="${HOME}/.config/dash-forge/test-identities"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s' "$ID_DEPLOYER_JSON" > "$dir/DEPLOYER.identity.json"
          # harness_init checks for the whole role set; only DEPLOYER signs here.
          for r in COLLAB CONTRIB; do cp "$dir/DEPLOYER.identity.json" "$dir/$r.identity.json"; done
          chmod 600 "$dir"/*.identity.json
      - name: Build CLI binaries
        timeout-minutes: 30
        run: cargo build --locked -p dg -p git-remote-dash
      - name: Seed
        timeout-minutes: 12
        run: bash e2e/cli/seed-read-fixture.sh

  cli-suite:
    name: cli e2e (live devnet moutai)
    needs: fixtures
    if: needs.fixtures.outputs.present == 'true'
    runs-on: ubuntu-latest
    # checkout + protoc + toolchain + cache (~3 min), build (≤30), suite (≤45).
    timeout-minutes: 85
    env:
      ID_OWNER_JSON: ${{ secrets.FORGE_MOUTAI_IDENTITY_OWNER }}
      ID_COLLAB_JSON: ${{ secrets.FORGE_MOUTAI_IDENTITY_COLLAB }}
      ID_CONTRIB_JSON: ${{ secrets.FORGE_MOUTAI_IDENTITY_CONTRIB }}
      ID_TESTNET_JSON: ${{ secrets.FORGE_TEST_IDENTITY_CONTRIB }}
    steps:
      - uses: actions/checkout@v5

      # Ubuntu's `protobuf-compiler` package is protoc 3.21.x, whose `libprotoc 3.21.12`
      # version string the tenderdash proto-compiler cannot parse ("invalid float literal") —
      # protobuf renumbered to `libprotoc <major>.<minor>` at v22. Install a pinned modern
      # release directly so the version is explicit and reproducible.
      - name: Install protoc
        env:
          PROTOC_VERSION: '28.3'
        run: |
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-cli

      - name: Materialize fixture identities
        run: |
          dir="${HOME}/.config/dash-forge/test-identities"
          mkdir -p "$dir/devnet-moutai" && chmod 700 "$dir" "$dir/devnet-moutai"
          printf '%s' "$ID_OWNER_JSON"    > "$dir/devnet-moutai/OWNER.identity.json"
          printf '%s' "$ID_COLLAB_JSON"   > "$dir/devnet-moutai/COLLAB.identity.json"
          printf '%s' "$ID_CONTRIB_JSON"  > "$dir/devnet-moutai/CONTRIB.identity.json"
          printf '%s' "$ID_TESTNET_JSON"  > "$dir/CONTRIB.identity.json"
          chmod 600 "$dir"/*.identity.json "$dir"/devnet-moutai/*.identity.json

      # Built in its own step so a slow (cache-miss) build cannot eat into the suite's time
      # budget below; run.sh picks the binaries up from target/debug.
      - name: Build CLI binaries
        timeout-minutes: 30
        run: cargo build --locked -p dg -p git-remote-dash

      # run.sh exits non-zero if any scenario FAILs, or if more than E2E_MAX_SKIPS scenarios
      # SKIP (a SKIP means a check flaked on every one of its retries). Every command is
      # bounded by E2E_TIMEOUT, every scenario by E2E_SCENARIO_TIMEOUT and the suite,
      # cleanup included, by E2E_SUITE_BUDGET (40 min), so a hang costs one scenario and the
      # matrix is always written; the step timeout is only a backstop. The matrix goes to
      # stderr, so capture it, put it in the step summary, and still warn loudly when
      # nothing actually ran.
      - name: CLI e2e suite
        timeout-minutes: 45
        run: |
          # GH Actions runs this under `bash -e`, so the pipeline's failure must be caught
          # with `|| rc=$?` — otherwise the step exits before writing the summary, which is
          # precisely the run whose output matters most.
          set -o pipefail
          rc=0
          bash e2e/cli/run.sh 2>&1 | tee /tmp/e2e.log || rc=$?
          {
            echo "### CLI e2e result"
            echo
            echo '```'
            tail -n 25 /tmp/e2e.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          counts=$(grep -oE 'passed=[0-9]+ +skipped=[0-9]+ +failed=[0-9]+' /tmp/e2e.log | tail -1 || true)
          passed=$(sed -nE 's/.*passed=([0-9]+).*/\1/p' <<<"$counts")
          skipped=$(sed -nE 's/.*skipped=([0-9]+).*/\1/p' <<<"$counts")
          if [ "${passed:-0}" -eq 0 ] && [ "${skipped:-0}" -gt 0 ]; then
            echo "::warning title=CLI e2e ran nothing::every scenario SKIPPED (${skipped}); this is not a pass"
          elif [ "${skipped:-0}" -gt 0 ]; then
            echo "::warning title=CLI e2e skipped ${skipped}::a scenario flaked on every retry; see the matrix"
          fi
          exit $rc

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cli-e2e-logs
          path: |
            /tmp/e2e.log
            /tmp/dash-forge-e2e/**/*.err
            /tmp/dash-forge-e2e/**/*.out
          retention-days: 7
          if-no-files-found: ignore
