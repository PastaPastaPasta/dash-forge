name: Testnet Nightly

# Nightly certification against LIVE Dash Platform testnet.
#
# The suites this drives are implemented and live in the repo:
#   * forge-web/e2e/          — Playwright: read paths, fallback browse, zero-backend, a11y
#   * e2e/cli/run.sh          — 7 CLI scenarios: clone/push round-trip, non-ff, ref delete,
#                               frozen push, no-token push, third-party verify, depth+filter
#
# They split by what they need:
#   * READ-ONLY specs need only a network path to testnet DAPI and the seeded fixture repo,
#     so they run unconditionally and their failure fails this workflow.
#   * The CLI suite and the write specs need FUNDED fixture identities, which cannot live in
#     a fork's PR context. They run only when the fixture secrets are present. When those
#     secrets are absent the job is reported as SKIPPED WITH A NOTICE — never as a pass.
#
# Fixture identity secrets (e2e/cli/config.sh names the roles):
#   FORGE_TEST_IDENTITY_DEPLOYER  - owns the reused m1 repo, grants tokens
#   FORGE_TEST_IDENTITY_COLLAB    - holds an unfrozen WRITE token
#   FORGE_TEST_IDENTITY_CONTRIB   - holds no token (negative push case)
#   FORGE_TEST_IDENTITY_FROZEN    - holds a frozen WRITE token (negative push case)
# Each holds the bridge-format identity JSON that `dg` reads from
# ~/.config/dash-forge/test-identities/<ROLE>.identity.json.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: testnet-nightly
  cancel-in-progress: false

jobs:
  web-read-paths:
    name: playwright (read-only, live testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: forge-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: forge-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # auth-write needs a funded identity; everything else is a read against live testnet.
      - name: Playwright read-path + a11y specs
        run: pnpm exec playwright test read-paths.spec.ts fallback-browse.spec.ts zero-backend.spec.ts a11y.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: forge-web/e2e/report
          retention-days: 7

  cli-suite:
    name: cli e2e (live testnet, needs funded fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ID_DEPLOYER_JSON: ${{ secrets.FORGE_TEST_IDENTITY_DEPLOYER }}
      ID_COLLAB_JSON: ${{ secrets.FORGE_TEST_IDENTITY_COLLAB }}
      ID_CONTRIB_JSON: ${{ secrets.FORGE_TEST_IDENTITY_CONTRIB }}
      ID_FROZEN_JSON: ${{ secrets.FORGE_TEST_IDENTITY_FROZEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Are the fixture identities configured?
        id: fixtures
        run: |
          missing=()
          for name in ID_DEPLOYER_JSON ID_COLLAB_JSON ID_CONTRIB_JSON ID_FROZEN_JSON; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### CLI e2e suite skipped"
              echo
              echo "Missing fixture-identity secrets: \`${missing[*]}\`."
              echo
              echo "These identities must exist and be funded on testnet for the CLI suite to"
              echo "run. Until they are configured this job reports SKIPPED — it is **not** a"
              echo "passing run of the suite. See \`e2e/cli/config.sh\` for the role pool and"
              echo "\`docs/testing/e2e-test-plan.md\` for provisioning."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=CLI e2e skipped::fixture identities not configured (${missing[*]})"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install protoc
        if: steps.fixtures.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        if: steps.fixtures.outputs.present == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.fixtures.outputs.present == 'true'

      - name: Materialize fixture identities
        if: steps.fixtures.outputs.present == 'true'
        run: |
          dir="${HOME}/.config/dash-forge/test-identities"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s' "$ID_DEPLOYER_JSON" > "$dir/DEPLOYER.identity.json"
          printf '%s' "$ID_COLLAB_JSON"   > "$dir/COLLAB.identity.json"
          printf '%s' "$ID_CONTRIB_JSON"  > "$dir/CONTRIB.identity.json"
          printf '%s' "$ID_FROZEN_JSON"   > "$dir/FROZEN.identity.json"
          chmod 600 "$dir"/*.identity.json

      # run.sh exits non-zero if ANY scenario FAILs; SKIPs (testnet funds / InstantSend
      # flakiness) are reported but non-fatal, and land in the step summary either way.
      - name: CLI e2e suite
        if: steps.fixtures.outputs.present == 'true'
        run: make e2e
