name: Devnet Nightly

# Nightly certification against LIVE devnet sakura, where forge-v2 (Platform protocol 14) is
# deployed. Testnet and mainnet still run protocol 13 and have no forge-v2 deployment;
# testnet runs resume here once protocol 14 reaches testnet and forge-v2 is deployed there.
#
# The suites this drives:
#   * forge-web/e2e/          — Playwright on a sakura build: v2 read paths, fallback browse,
#                               zero-backend, a11y, against the forge-v2 read fixture
#   * e2e/cli/run.sh          — the CLI scenarios on sakura (e2e/README.md lists them):
#                               clone/push round-trip, non-ff, ref delete, revoked-writer push,
#                               non-member push, third-party verify, depth+filter, issue
#                               lifecycle, PR from a fork with a real merge, release asset,
#                               star/unstar, dg init, private repos, config and storage UX.
#                               The storage fixture (infra/docker-compose.yml) runs on the
#                               runner for the scenarios that store packs locally (11, 13, 20).
#
# They split by what they need:
#   * The READ-ONLY browser specs need only a network path to sakura DAPI and the read
#     fixture (`forge-v2-demo`, seeded by forge-contracts/scripts/seed-v2-fixture.mjs;
#     e2e/README.md reserves it), so they run unconditionally and their failure fails this
#     workflow. The seed job runs first when the fixture secrets exist; it is idempotent (an
#     existing fixture is left alone).
#   * The CLI suite needs FUNDED fixture identities, which cannot live in a fork's PR
#     context. A separate `fixtures` probe job decides whether it runs, so when the secrets
#     are absent the suite job's conclusion is literally `skipped` rather than a green job
#     with everything gated out — a distinction any badge or alert rule can see.
#   * The browser WRITE specs (v2-writes, v2-auth) spend real devnet funds and v2-auth needs
#     the devnet faucet key; they run by hand (`E2E_WRITE=1`, see forge-web/e2e/).
#
# Fixture identity secrets (e2e/cli/config.sh names the roles):
#   FORGE_SAKURA_IDENTITY_OWNER      - owns the e2e-cli repo and the read fixture's demo repo
#   FORGE_SAKURA_IDENTITY_MAINTAINER - maintainer of the demo repo, owner of forge-v2-empty
#   FORGE_SAKURA_IDENTITY_COLLAB     - added as a writer, then removed (scenario 04)
#   FORGE_SAKURA_IDENTITY_CONTRIB    - never a member (scenario 05)
# Each holds the bridge-format identity JSON that `dg` reads from
# ~/.config/dash-forge/test-identities/devnet-sakura/<ROLE>.identity.json.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: devnet-nightly
  cancel-in-progress: false

jobs:
  web-read-paths:
    name: playwright (read-only, live devnet sakura)
    # Reads the read fixture (e2e/README.md), so it waits for the seed job — but still runs
    # when that job is skipped (no secrets: the fixture is read as it stands) or failed (the
    # specs then say what is wrong with it).
    needs: seed-read-fixture
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: forge-web
    env:
      E2E_DEVNET: sakura
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: forge-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build for devnet sakura
        env:
          NEXT_PUBLIC_NETWORK: devnet
          NEXT_PUBLIC_DEVNET_NAME: sakura
        run: pnpm build
      # E2E_SKIP_BUILD reuses the `out/` just built — the Playwright webServer would
      # otherwise run `pnpm build` a second time before serving it.
      - name: Playwright read-path + a11y specs
        env:
          E2E_SKIP_BUILD: '1'
        run: pnpm exec playwright test v2-reads.spec.ts fallback-browse.spec.ts zero-backend.spec.ts a11y.spec.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: forge-web/e2e/report
          retention-days: 7

  # A separate probe job so the suite job's CONCLUSION is literally `skipped` when the
  # fixtures are absent. Gating the steps inside one job leaves that job green, which is
  # indistinguishable from a real pass to a badge, the checks API, or a "notify on failed
  # nightly" rule — the exact confusion this workflow is meant to remove.
  fixtures:
    name: fixture identities configured?
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.probe.outputs.present }}
      # The read-fixture seeder signs with all four roles.
      seeder: ${{ steps.probe.outputs.seeder }}
    steps:
      - name: Probe
        id: probe
        env:
          FORGE_SAKURA_IDENTITY_OWNER: ${{ secrets.FORGE_SAKURA_IDENTITY_OWNER }}
          FORGE_SAKURA_IDENTITY_MAINTAINER: ${{ secrets.FORGE_SAKURA_IDENTITY_MAINTAINER }}
          FORGE_SAKURA_IDENTITY_COLLAB: ${{ secrets.FORGE_SAKURA_IDENTITY_COLLAB }}
          FORGE_SAKURA_IDENTITY_CONTRIB: ${{ secrets.FORGE_SAKURA_IDENTITY_CONTRIB }}
        run: |
          if [ -n "$FORGE_SAKURA_IDENTITY_OWNER" ] && [ -n "$FORGE_SAKURA_IDENTITY_MAINTAINER" ] \
             && [ -n "$FORGE_SAKURA_IDENTITY_COLLAB" ] && [ -n "$FORGE_SAKURA_IDENTITY_CONTRIB" ]; then
            echo "seeder=true" >> "$GITHUB_OUTPUT"
          else
            echo "seeder=false" >> "$GITHUB_OUTPUT"
          fi
          missing=()
          # Report the SECRET names an operator has to create, not internal aliases.
          for name in FORGE_SAKURA_IDENTITY_OWNER FORGE_SAKURA_IDENTITY_COLLAB \
                      FORGE_SAKURA_IDENTITY_CONTRIB; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### CLI e2e suite skipped"
              echo
              echo "Missing repository secrets: \`${missing[*]}\`."
              echo
              echo "These identities must exist and be funded on devnet sakura for the CLI"
              echo "suite to run. The suite job below reports SKIPPED — it is **not** a passing"
              echo "run. See \`e2e/cli/config.sh\` for the role pool and"
              echo "\`docs/testing/e2e-test-plan.md\` for provisioning."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=CLI e2e skipped::missing secrets: ${missing[*]}"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

  # Make sure the browser specs' read fixture exists. It is its own pair of repos, written only
  # by this job, so nothing the CLI suite or an ad-hoc storage run stores can reach what the
  # browser reads (e2e/README.md). Idempotent: a no-op once the fixture is on chain.
  seed-read-fixture:
    name: seed the read fixture
    needs: fixtures
    if: needs.fixtures.outputs.seeder == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forge-contracts/sdk-v2/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: forge-contracts/sdk-v2
      # The keys live only in this step's environment, not the job's.
      - name: Materialize the fixture identities
        env:
          ID_OWNER_JSON: ${{ secrets.FORGE_SAKURA_IDENTITY_OWNER }}
          ID_MAINTAINER_JSON: ${{ secrets.FORGE_SAKURA_IDENTITY_MAINTAINER }}
          ID_COLLAB_JSON: ${{ secrets.FORGE_SAKURA_IDENTITY_COLLAB }}
          ID_CONTRIB_JSON: ${{ secrets.FORGE_SAKURA_IDENTITY_CONTRIB }}
        run: |
          dir="${HOME}/.config/dash-forge/test-identities/devnet-sakura"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s' "$ID_OWNER_JSON"      > "$dir/OWNER.identity.json"
          printf '%s' "$ID_MAINTAINER_JSON" > "$dir/MAINTAINER.identity.json"
          printf '%s' "$ID_COLLAB_JSON"     > "$dir/COLLAB.identity.json"
          printf '%s' "$ID_CONTRIB_JSON"    > "$dir/CONTRIB.identity.json"
          chmod 600 "$dir"/*.identity.json
      - name: Seed
        timeout-minutes: 15
        run: node forge-contracts/scripts/seed-v2-fixture.mjs --network devnet --devnet-name sakura

  cli-suite:
    name: cli e2e (live devnet sakura)
    # After the seed job: both sign as OWNER, and two signers on one identity at once
    # collide on its contract nonce.
    needs: [fixtures, seed-read-fixture]
    if: ${{ !cancelled() && needs.fixtures.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    # checkout + protoc + toolchain + cache (~3 min), storage fixture (≤3), build (≤30),
    # fixture wait (≤3), suite (≤45), plus room for the log upload after a failure.
    timeout-minutes: 95
    env:
      ID_OWNER_JSON: ${{ secrets.FORGE_SAKURA_IDENTITY_OWNER }}
      ID_COLLAB_JSON: ${{ secrets.FORGE_SAKURA_IDENTITY_COLLAB }}
      ID_CONTRIB_JSON: ${{ secrets.FORGE_SAKURA_IDENTITY_CONTRIB }}
    steps:
      - uses: actions/checkout@v5

      # The local S3 store from the storage fixture the Rust workflow's `storage-it` step
      # uses (infra/docker-compose.yml): RustFS and its bucket setup only, since no CLI
      # scenario needs kubo or nginx. Scenarios 11, 13 and 20 store packs on it. Not fatal:
      # if it will not start, the ::error below marks the run, run.sh drops 11 and 13, 20
      # SKIPs its dead-copy step, and every other scenario still runs. `up -d` waits for
      # RustFS's healthcheck before it creates s3-init, so this step takes a minute or two.
      - name: Start the storage fixture
        id: storage
        continue-on-error: true
        run: |
          docker compose -f infra/docker-compose.yml up -d rustfs s3-init || {
            echo "::error title=Storage fixture::RustFS did not start; scenarios 11, 13 and 20 cannot store packs"
            exit 1
          }

      # Ubuntu's `protobuf-compiler` package is protoc 3.21.x, whose `libprotoc 3.21.12`
      # version string the tenderdash proto-compiler cannot parse ("invalid float literal") —
      # protobuf renumbered to `libprotoc <major>.<minor>` at v22. Install a pinned modern
      # release directly so the version is explicit and reproducible.
      - name: Install protoc
        env:
          PROTOC_VERSION: '28.3'
        run: |
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-cli

      - name: Materialize fixture identities
        run: |
          dir="${HOME}/.config/dash-forge/test-identities"
          mkdir -p "$dir/devnet-sakura" && chmod 700 "$dir" "$dir/devnet-sakura"
          printf '%s' "$ID_OWNER_JSON"    > "$dir/devnet-sakura/OWNER.identity.json"
          printf '%s' "$ID_COLLAB_JSON"   > "$dir/devnet-sakura/COLLAB.identity.json"
          printf '%s' "$ID_CONTRIB_JSON"  > "$dir/devnet-sakura/CONTRIB.identity.json"
          chmod 600 "$dir"/devnet-sakura/*.identity.json

      # Built in its own step so a slow (cache-miss) build cannot eat into the suite's time
      # budget below; run.sh picks the binaries up from target/debug.
      - name: Build CLI binaries
        timeout-minutes: 30
        run: cargo build --locked -p dg -p git-remote-dash

      # The same readiness gate as `make storage-it`: the buckets, their policies and CORS
      # exist only once s3-init has exited 0.
      - name: Wait for the storage fixture
        id: storage_wait
        if: steps.storage.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          fail() { echo "::error title=Storage fixture::$1; scenarios 11, 13 and 20 cannot store packs"; exit 1; }
          rc=$(docker wait forge-e2e-s3-init)
          [ "$rc" = 0 ] || { docker logs forge-e2e-s3-init; fail "s3-init failed (exit $rc)"; }
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:9000/health/ready && break
            [ "$i" = 60 ] && fail "RustFS not ready after 120 s"
            sleep 2
          done

      # run.sh exits non-zero if any scenario FAILs, or if more than E2E_MAX_SKIPS scenarios
      # SKIP (a SKIP means a check flaked on every one of its retries). Every command is
      # bounded by E2E_TIMEOUT, every scenario by E2E_SCENARIO_TIMEOUT and the suite,
      # cleanup included, by E2E_SUITE_BUDGET (40 min), so a hang costs one scenario and the
      # matrix is always written; the step timeout is only a backstop. The matrix goes to
      # stderr, so capture it, put it in the step summary, and still warn loudly when
      # nothing actually ran.
      - name: CLI e2e suite
        timeout-minutes: 45
        run: |
          # GH Actions runs this under `bash -e`, so the pipeline's failure must be caught
          # with `|| rc=$?` — otherwise the step exits before writing the summary, which is
          # precisely the run whose output matters most.
          set -o pipefail
          rc=0
          bash e2e/cli/run.sh 2>&1 | tee /tmp/e2e.log || rc=$?
          {
            echo "### CLI e2e result"
            echo
            echo '```'
            tail -n 25 /tmp/e2e.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          counts=$(grep -oE 'passed=[0-9]+ +skipped=[0-9]+ +failed=[0-9]+' /tmp/e2e.log | tail -1 || true)
          passed=$(sed -nE 's/.*passed=([0-9]+).*/\1/p' <<<"$counts")
          skipped=$(sed -nE 's/.*skipped=([0-9]+).*/\1/p' <<<"$counts")
          if [ "${passed:-0}" -eq 0 ] && [ "${skipped:-0}" -gt 0 ]; then
            echo "::warning title=CLI e2e ran nothing::every scenario SKIPPED (${skipped}); this is not a pass"
          elif [ "${skipped:-0}" -gt 0 ]; then
            echo "::warning title=CLI e2e skipped ${skipped}::a scenario flaked on every retry; see the matrix"
          fi
          exit $rc

      - name: Storage fixture logs
        if: failure() || steps.storage.outcome == 'failure' || steps.storage_wait.outcome == 'failure'
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail 200

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cli-e2e-logs
          path: |
            /tmp/e2e.log
            /tmp/dash-forge-e2e/**/*.err
            /tmp/dash-forge-e2e/**/*.out
          retention-days: 7
          if-no-files-found: ignore

  verify-app:
    name: verify-app (forge.dashhq.org)
    # The hosted web app, file by file, against the manifest this repository's Pages deploy
    # attested (docs/guides/verify-the-app.md). A failure means the site serves bytes no build
    # of this repository made: treat it as an incident (docs/hosting.md).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # The tenderdash proto-compiler needs a modern protoc (see cli-suite).
      - name: Install protoc
        env:
          PROTOC_VERSION: '28.3'
        run: |
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-cli
      - name: Build dg
        timeout-minutes: 30
        run: cargo build --locked -p dg
      - name: dg verify-app
        env:
          # GitHub's attestation lookup, past the shared runners' anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: target/debug/dg verify-app https://forge.dashhq.org
