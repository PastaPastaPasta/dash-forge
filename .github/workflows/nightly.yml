name: Testnet Nightly

# Nightly certification against LIVE testnet, where forge-v2 (Platform protocol 14) is registered
# (2026-10-26, forge-contracts/deployments/testnet.json). Testnet is a production network:
# everything the suites write there is permanent, so the write runs are opted in explicitly
# (E2E_LIVE_TARGET=1, --production testnet) and sign only with the fresh fixture identities below,
# never the July-era pool or the deployer (e2e/cli/config.sh).
#
# The suites this drives:
#   * forge-web/e2e/          — Playwright on a testnet build: v2 read paths, fallback browse,
#                               zero-backend, a11y, against the forge-v2 read fixture
#   * e2e/cli/run.sh          — the CLI scenarios on testnet (e2e/README.md lists them):
#                               clone/push round-trip, non-ff, ref delete, revoked-writer push,
#                               non-member push, third-party verify, depth+filter, issue
#                               lifecycle, PR from a fork with a real merge, release asset,
#                               star/unstar, dg init, private repos, config and storage UX.
#                               The storage fixture (infra/docker-compose.yml) runs on the
#                               runner for the scenarios that store packs locally (11, 13, 20).
#
# They split by what they need:
#   * The READ-ONLY browser specs need only a network path to testnet DAPI and the read
#     fixture (`forge-v2-demo`, seeded by forge-contracts/scripts/seed-v2-fixture.mjs;
#     e2e/README.md reserves it), so they run unconditionally and their failure fails this
#     workflow. A spec that reads the fixture skips until forge-contracts/deployments/
#     fixtures/testnet.json is committed: the seed job uploads that file as an artifact
#     (`read-fixture-testnet`) for a maintainer to commit. The seed job runs first when the
#     fixture secrets exist; it is idempotent (an existing fixture is left alone).
#   * The CLI suite needs FUNDED fixture identities and a funding key for the scenarios that
#     mint, which cannot live in a fork's PR context. A separate `fixtures` probe job decides
#     whether it runs, so when the secrets are absent the suite job's conclusion is literally
#     `skipped` rather than a green job with everything gated out — a distinction any badge or
#     alert rule can see.
#   * The browser WRITE specs (v2-writes, v2-auth) run by hand (`E2E_WRITE=1` with
#     `E2E_LIVE_TARGET=1`, see forge-web/e2e/).
#   * verify-app checks the hosted site on its own: nothing waits for it, so its failure never
#     skips the other jobs. It fails while Cloudflare injects its Web Analytics beacon into the
#     HTML (an operator setting, docs/hosting.md §6), not on a code change.
#
# Fixture secrets (e2e/cli/config.sh names the roles):
#   FORGE_TESTNET_IDENTITY_OWNER      - owns the e2e-cli repo and the read fixture's demo repo
#   FORGE_TESTNET_IDENTITY_MAINTAINER - maintainer of the demo repo, owner of forge-v2-empty
#   FORGE_TESTNET_IDENTITY_COLLAB     - added as a writer, then removed (scenario 04)
#   FORGE_TESTNET_IDENTITY_CONTRIB    - never a member (scenario 05)
#   FORGE_TESTNET_MINT_FUNDING_WIF    - a testnet wallet key (WIF) the minting scenarios spend
#                                       from (19, 24, 25, 26, 33, 36); on testnet they FAIL
#                                       without it, so the CLI suite needs it too
#   FORGE_TESTNET_IDENTITY_CI_RUNNER  - optional: the runner scenario 35 enrols (it SKIPs without)
# Each identity secret holds the bridge-format identity JSON that `dg` reads from
# ~/.config/dash-forge/test-identities/testnet-scratch/<ROLE>.identity.json. They must be fresh
# identities, never the July-era testnet pool (config.sh refuses those ids).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: testnet-nightly
  cancel-in-progress: false

jobs:
  web-read-paths:
    name: playwright (read-only, live testnet)
    # Reads the read fixture (e2e/README.md), so it waits for the seed job — but still runs
    # when that job is skipped (no secrets: the fixture is read as it stands) or failed (the
    # specs then say what is wrong with it).
    needs: seed-read-fixture
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: forge-web
    env:
      E2E_NETWORK: testnet
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: forge-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build for testnet
        env:
          NEXT_PUBLIC_NETWORK: testnet
          NEXT_PUBLIC_FIAT_RATE_URL: /__e2e/fiat-rates.json
        run: pnpm build
      # E2E_SKIP_BUILD reuses the `out/` just built — the Playwright webServer would
      # otherwise run `pnpm build` a second time before serving it.
      - name: Playwright read-path + a11y specs
        env:
          E2E_SKIP_BUILD: '1'
        run: pnpm exec playwright test v2-reads.spec.ts fallback-browse.spec.ts zero-backend.spec.ts a11y.spec.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: playwright-report
          path: forge-web/e2e/report
          retention-days: 7

  # A separate probe job so the suite job's CONCLUSION is literally `skipped` when the
  # fixtures are absent. Gating the steps inside one job leaves that job green, which is
  # indistinguishable from a real pass to a badge, the checks API, or a "notify on failed
  # nightly" rule — the exact confusion this workflow is meant to remove.
  fixtures:
    name: fixture identities configured?
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.probe.outputs.present }}
      # The read-fixture seeder signs with all four roles.
      seeder: ${{ steps.probe.outputs.seeder }}
    steps:
      - name: Probe
        id: probe
        env:
          FORGE_TESTNET_IDENTITY_OWNER: ${{ secrets.FORGE_TESTNET_IDENTITY_OWNER }}
          FORGE_TESTNET_IDENTITY_MAINTAINER: ${{ secrets.FORGE_TESTNET_IDENTITY_MAINTAINER }}
          FORGE_TESTNET_IDENTITY_COLLAB: ${{ secrets.FORGE_TESTNET_IDENTITY_COLLAB }}
          FORGE_TESTNET_IDENTITY_CONTRIB: ${{ secrets.FORGE_TESTNET_IDENTITY_CONTRIB }}
          FORGE_TESTNET_MINT_FUNDING_WIF: ${{ secrets.FORGE_TESTNET_MINT_FUNDING_WIF }}
        run: |
          if [ -n "$FORGE_TESTNET_IDENTITY_OWNER" ] && [ -n "$FORGE_TESTNET_IDENTITY_MAINTAINER" ] \
             && [ -n "$FORGE_TESTNET_IDENTITY_COLLAB" ] && [ -n "$FORGE_TESTNET_IDENTITY_CONTRIB" ]; then
            echo "seeder=true" >> "$GITHUB_OUTPUT"
          else
            echo "seeder=false" >> "$GITHUB_OUTPUT"
          fi
          missing=()
          # Report the SECRET names an operator has to create, not internal aliases.
          for name in FORGE_TESTNET_IDENTITY_OWNER FORGE_TESTNET_IDENTITY_COLLAB \
                      FORGE_TESTNET_IDENTITY_CONTRIB FORGE_TESTNET_MINT_FUNDING_WIF; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### CLI e2e suite skipped"
              echo
              echo "Missing repository secrets: \`${missing[*]}\`."
              echo
              echo "These identities must exist and be funded on testnet, with a funded testnet"
              echo "wallet key for the minting scenarios, for the CLI suite to run. The suite"
              echo "job below reports SKIPPED — it is **not** a passing"
              echo "run. See \`e2e/cli/config.sh\` for the role pool and"
              echo "\`docs/testing/e2e-test-plan.md\` for provisioning."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=CLI e2e skipped::missing secrets: ${missing[*]}"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

  # Make sure the browser specs' read fixture exists. It is its own pair of repos, written only
  # by this job, so nothing the CLI suite or an ad-hoc storage run stores can reach what the
  # browser reads (e2e/README.md). Idempotent: a no-op once the fixture is on chain.
  seed-read-fixture:
    name: seed the read fixture
    needs: fixtures
    if: needs.fixtures.outputs.seeder == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forge-contracts/sdk-v2/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: forge-contracts/sdk-v2
      # The keys live only in this step's environment, not the job's.
      - name: Materialize the fixture identities
        env:
          ID_OWNER_JSON: ${{ secrets.FORGE_TESTNET_IDENTITY_OWNER }}
          ID_MAINTAINER_JSON: ${{ secrets.FORGE_TESTNET_IDENTITY_MAINTAINER }}
          ID_COLLAB_JSON: ${{ secrets.FORGE_TESTNET_IDENTITY_COLLAB }}
          ID_CONTRIB_JSON: ${{ secrets.FORGE_TESTNET_IDENTITY_CONTRIB }}
        run: |
          dir="${HOME}/.config/dash-forge/test-identities/testnet-scratch"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s' "$ID_OWNER_JSON"      > "$dir/OWNER.identity.json"
          printf '%s' "$ID_MAINTAINER_JSON" > "$dir/MAINTAINER.identity.json"
          printf '%s' "$ID_COLLAB_JSON"     > "$dir/COLLAB.identity.json"
          printf '%s' "$ID_CONTRIB_JSON"    > "$dir/CONTRIB.identity.json"
          chmod 600 "$dir"/*.identity.json
      # --production testnet: the read fixture is the one sanctioned write to the live
      # registration from this job (CONT-V-01, QA-14).
      - name: Seed
        timeout-minutes: 15
        run: |
          node forge-contracts/scripts/seed-v2-fixture.mjs --network testnet --production testnet \
            --identities "${HOME}/.config/dash-forge/test-identities/testnet-scratch" \
            --summary "${RUNNER_TEMP}/fixtures/testnet.json"
      # Written only when this run seeded; commit it as forge-contracts/deployments/fixtures/testnet.json.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: read-fixture-testnet
          path: ${{ runner.temp }}/fixtures/testnet.json
          retention-days: 30
          if-no-files-found: ignore

  cli-suite:
    name: cli e2e (live testnet)
    # After the seed job: both sign as OWNER, and two signers on one identity at once
    # collide on its contract nonce.
    needs: [fixtures, seed-read-fixture]
    if: ${{ !cancelled() && needs.fixtures.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    # checkout + node, expect, balance pre-flight (≤5) + protoc + toolchain + cache (~3 min),
    # storage fixture (≤3), build (≤30), run-only identities (≤15),
    # fixture wait (≤3), suite (≤60), plus room for the log upload after a failure.
    timeout-minutes: 125
    env:
      DASH_FORGE_FIAT: "off"
      # e2e/cli/config.sh: testnet, written knowingly (QA-14), with the identities and the
      # funding key the next step writes (its default E2E_IDENTITY_DIR, testnet-scratch).
      DASH_FORGE_NETWORK: testnet
      E2E_LIVE_TARGET: '1'
      ID_OWNER_JSON: ${{ secrets.FORGE_TESTNET_IDENTITY_OWNER }}
      ID_COLLAB_JSON: ${{ secrets.FORGE_TESTNET_IDENTITY_COLLAB }}
      ID_CONTRIB_JSON: ${{ secrets.FORGE_TESTNET_IDENTITY_CONTRIB }}
      ID_CI_RUNNER_JSON: ${{ secrets.FORGE_TESTNET_IDENTITY_CI_RUNNER }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The funding key lives only in this step's environment; the suite reads it from the file
      # (config.sh accepts a testnet key named testnet-funding.wif).
      - name: Materialize fixture identities and the funding key
        env:
          MINT_FUNDING_WIF: ${{ secrets.FORGE_TESTNET_MINT_FUNDING_WIF }}
        run: |
          dir="${HOME}/.config/dash-forge/test-identities"
          mkdir -p "$dir/testnet-scratch" && chmod 700 "$dir" "$dir/testnet-scratch"
          printf '%s' "$ID_OWNER_JSON"    > "$dir/testnet-scratch/OWNER.identity.json"
          printf '%s' "$ID_COLLAB_JSON"   > "$dir/testnet-scratch/COLLAB.identity.json"
          printf '%s' "$ID_CONTRIB_JSON"  > "$dir/testnet-scratch/CONTRIB.identity.json"
          if [ -n "$ID_CI_RUNNER_JSON" ]; then
            printf '%s' "$ID_CI_RUNNER_JSON" > "$dir/testnet-scratch/CI-RUNNER.identity.json"
          fi
          printf '%s' "$MINT_FUNDING_WIF" > "$dir/testnet-funding.wif"
          chmod 600 "$dir"/testnet-scratch/*.identity.json "$dir/testnet-funding.wif"
          echo "E2E_MINT_FUNDING=$dir/testnet-funding.wif" >> "$GITHUB_ENV"

      # tools/mint-identity mints the run-only identities (19, 24, 25, 26) and reads balances;
      # scenario 25 drives a tty with expect.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/mint-identity/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/mint-identity
      - name: Install expect
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends expect

      # Fail in one line, before the build, when a fixture identity or the funding wallet cannot pay
      # for a run, instead of twenty scenarios failing on E401. The minimums are a little over one
      # run's spend, which the "Testnet spend" step below measures on every run.
      - name: Testnet balance pre-flight
        id: preflight
        timeout-minutes: 5
        run: |
          dir="${HOME}/.config/dash-forge/test-identities"
          ids=(--identity "OWNER=$dir/testnet-scratch/OWNER.identity.json=${E2E_MIN_OWNER:-0.5}"
               --identity "COLLAB=$dir/testnet-scratch/COLLAB.identity.json=0.05"
               --identity "CONTRIB=$dir/testnet-scratch/CONTRIB.identity.json=0.05")
          if [ -f "$dir/testnet-scratch/CI-RUNNER.identity.json" ]; then
            ids+=(--identity "CI-RUNNER=$dir/testnet-scratch/CI-RUNNER.identity.json=0.02")
          fi
          node tools/mint-identity/credits.mjs --network testnet "${ids[@]}" \
            --funding "$E2E_MINT_FUNDING=1.2" --out "${RUNNER_TEMP}/balances-before.json"

      # Scenarios 19, 24, 25 and 26 each run as identities minted for the run. Mint all five in
      # one batch in the background while the CLI builds (a testnet mint waits minutes for its
      # lock), and hand them over through the scenarios' own overrides below. If the batch fails
      # the scenarios mint for themselves, as before.
      - name: Mint the run-only identities (background)
        run: |
          dir="${RUNNER_TEMP}/run-ids"
          mkdir -m 700 "$dir"
          nohup flock -w 600 /tmp/qa-mint-testnet.lock node tools/mint-identity/mint.mjs pool --network testnet \
            --funding fund-from-key --funding-key-file "$E2E_MINT_FUNDING" --out "$dir" \
            --labels P_OWNER,P_MEMBER,S25,FRESH,S26 \
            --role-amounts P_OWNER=0.2,P_MEMBER=0.2,S25=0.3,FRESH=0.1,S26=0.05 \
            >"${RUNNER_TEMP}/run-ids.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/run-ids.pid"

      # The local S3 store from the storage fixture the Rust workflow's `storage-it` step
      # uses (infra/docker-compose.yml): RustFS and its bucket setup only, since no CLI
      # scenario needs kubo or nginx. Scenarios 11, 13 and 20 store packs on it. Not fatal:
      # if it will not start, the ::error below marks the run, run.sh drops 11 and 13, 20
      # SKIPs its dead-copy step, and every other scenario still runs. `up -d` waits for
      # RustFS's healthcheck before it creates s3-init, so this step takes a minute or two.
      - name: Start the storage fixture
        id: storage
        continue-on-error: true
        run: |
          docker compose -f infra/docker-compose.yml up -d rustfs s3-init || {
            echo "::error title=Storage fixture::RustFS did not start; scenarios 11, 13 and 20 cannot store packs"
            exit 1
          }

      # Ubuntu's `protobuf-compiler` package is protoc 3.21.x, whose `libprotoc 3.21.12`
      # version string the tenderdash proto-compiler cannot parse ("invalid float literal") —
      # protobuf renumbered to `libprotoc <major>.<minor>` at v22. Install a pinned modern
      # release directly so the version is explicit and reproducible.
      - name: Install protoc
        env:
          PROTOC_VERSION: '28.3'
        run: |
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: e2e-cli

      # Built in its own step so a slow (cache-miss) build cannot eat into the suite's time
      # budget below; run.sh picks the binaries up from target/debug.
      - name: Build CLI binaries
        timeout-minutes: 30
        run: cargo build --locked -p dg -p git-remote-dash

      # The same readiness gate as `make storage-it`: the buckets, their policies and CORS
      # exist only once s3-init has exited 0.
      - name: Wait for the storage fixture
        id: storage_wait
        if: steps.storage.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          fail() { echo "::error title=Storage fixture::$1; scenarios 11, 13 and 20 cannot store packs"; exit 1; }
          rc=$(docker wait forge-e2e-s3-init)
          [ "$rc" = 0 ] || { docker logs forge-e2e-s3-init; fail "s3-init failed (exit $rc)"; }
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:9000/health/ready && break
            [ "$i" = 60 ] && fail "RustFS not ready after 120 s"
            sleep 2
          done

      - name: Hand the run-only identities to the suite
        timeout-minutes: 15
        run: |
          pid=$(cat "${RUNNER_TEMP}/run-ids.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 5; done
          grep -E '^[0-9:]+ ' "${RUNNER_TEMP}/run-ids.log" | grep -vi 'mnemonic' | tail -n 40 || true
          dir="${RUNNER_TEMP}/run-ids"
          minted() { python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("identityId") else 1)' "$dir/$1.identity.json" 2>/dev/null; }
          missing=()
          for pair in E2E_P_OWNER:P_OWNER E2E_P_MEMBER:P_MEMBER E2E_S25_IDENTITY:S25 \
                      E2E_FRESH_IDENTITY:FRESH E2E_S26_OWNER:S26; do
            if minted "${pair#*:}"; then
              echo "${pair%%:*}=$dir/${pair#*:}.identity.json" >> "$GITHUB_ENV"
            else
              missing+=("${pair#*:}")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::warning title=Run-only identities::not minted: ${missing[*]}; those scenarios mint their own"
          fi

      # run.sh exits non-zero if any scenario FAILs, or if more than E2E_MAX_SKIPS scenarios
      # SKIP (a SKIP means a check flaked on every one of its retries). Every command is
      # bounded by E2E_TIMEOUT, every scenario by E2E_SCENARIO_TIMEOUT and the suite,
      # cleanup included, by E2E_SUITE_BUDGET (55 min), so a hang costs one scenario and the
      # matrix is always written; the step timeout is only a backstop. The matrix goes to
      # stderr, so capture it, put it in the step summary, and still warn loudly when
      # nothing actually ran.
      - name: CLI e2e suite
        timeout-minutes: 60
        env:
          # The default 40 min predates the minting scenarios and 35 running: about 45 min of
          # scenarios on testnet, plus the cleanup reserve.
          E2E_SUITE_BUDGET: '3300'
        run: |
          # GH Actions runs this under `bash -e`, so the pipeline's failure must be caught
          # with `|| rc=$?` — otherwise the step exits before writing the summary, which is
          # precisely the run whose output matters most.
          set -o pipefail
          rc=0
          bash e2e/cli/run.sh 2>&1 | tee /tmp/e2e.log || rc=$?
          {
            echo "### CLI e2e result"
            echo
            echo '```'
            tail -n 25 /tmp/e2e.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          counts=$(grep -oE 'passed=[0-9]+ +skipped=[0-9]+ +failed=[0-9]+' /tmp/e2e.log | tail -1 || true)
          passed=$(sed -nE 's/.*passed=([0-9]+).*/\1/p' <<<"$counts")
          skipped=$(sed -nE 's/.*skipped=([0-9]+).*/\1/p' <<<"$counts")
          if [ "${passed:-0}" -eq 0 ] && [ "${skipped:-0}" -gt 0 ]; then
            echo "::warning title=CLI e2e ran nothing::every scenario SKIPPED (${skipped}); this is not a pass"
          elif [ "${skipped:-0}" -gt 0 ]; then
            echo "::warning title=CLI e2e skipped ${skipped}::a scenario flaked on every retry; see the matrix"
          fi
          exit $rc

      # What this run cost each identity and the funding wallet: the data for the top-up cadence.
      - name: Testnet spend
        timeout-minutes: 5
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          dir="${HOME}/.config/dash-forge/test-identities"
          ids=()
          for role in OWNER COLLAB CONTRIB CI-RUNNER; do
            f="$dir/testnet-scratch/$role.identity.json"
            if [ -f "$f" ]; then ids+=(--identity "$role=$f=0"); fi
          done
          node tools/mint-identity/credits.mjs --network testnet "${ids[@]}" \
            --funding "$E2E_MINT_FUNDING=0" --before "${RUNNER_TEMP}/balances-before.json"

      - name: Storage fixture logs
        if: failure() || steps.storage.outcome == 'failure' || steps.storage_wait.outcome == 'failure'
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail 200

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: cli-e2e-logs
          path: |
            /tmp/e2e.log
            /tmp/dash-forge-e2e/**/*.err
            /tmp/dash-forge-e2e/**/*.out
          retention-days: 7
          if-no-files-found: ignore

  verify-app:
    name: verify-app (forge.dashhq.org)
    # The hosted web app, file by file, against the manifest this repository's Pages deploy
    # attested (docs/guides/verify-the-app.md). A failure means the site serves bytes no build
    # of this repository made: treat it as an incident (docs/hosting.md).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The tenderdash proto-compiler needs a modern protoc (see cli-suite).
      - name: Install protoc
        env:
          PROTOC_VERSION: '28.3'
        run: |
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: e2e-cli
      - name: Build dg
        timeout-minutes: 30
        run: cargo build --locked -p dg
      - name: dg verify-app
        env:
          # GitHub's attestation lookup, past the shared runners' anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        # Once more after 5 minutes: right after a deploy the CDN can serve old and new files
        # side by side.
        run: |
          target/debug/dg verify-app https://forge.dashhq.org || {
            echo "::warning::verify-app failed; retrying in 5 minutes in case a deploy was propagating"
            sleep 300
            target/debug/dg verify-app https://forge.dashhq.org
          }
