name: Web e2e

# The read-only Playwright suite on every PR that touches the web app or what it reads: the
# app built for devnet moutai, served locally, reading the public read fixture (e2e/README.md)
# through moutai's public DAPI. No secrets: every spec that signs or spends skips without
# E2E_WRITE. It is the regression gate for the UI — a spec that a deliberate UI change made
# stale fails in the PR that changed it, not in a nightly days later. A read the devnet
# rate-limits or drops is retried once (playwright.config.ts: `retries` under CI).
#
# It depends on moutai being up and seeded. When moutai is reset, this fails until the
# fixture is redeployed (forge-contracts/scripts/seed-v2-fixture.mjs), which is the signal.

on:
  pull_request:
    paths:
      - 'forge-web/**'
      - 'forge-contracts/deployments/**'
      - 'forge-contracts/scripts/seed-v2-fixture.mjs'
      - '.github/workflows/web-e2e.yml'
  push:
    branches: [master]
    paths:
      - 'forge-web/**'
      - 'forge-contracts/deployments/**'
      - '.github/workflows/web-e2e.yml'
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: playwright (read-only, devnet moutai)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: forge-web
    env:
      E2E_DEVNET: moutai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: forge-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build for devnet moutai
        env:
          NEXT_PUBLIC_NETWORK: devnet
          NEXT_PUBLIC_DEVNET_NAME: moutai
        run: pnpm build
      # E2E_SKIP_BUILD serves the `out/` just built instead of building a second time. Both
      # projects run: chromium (every spec) and webkit (sign-in resilience).
      - name: Playwright
        env:
          E2E_SKIP_BUILD: '1'
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-report
          path: |
            forge-web/e2e/report
            forge-web/e2e/test-results
          retention-days: 7
