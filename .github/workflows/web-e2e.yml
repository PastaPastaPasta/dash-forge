name: Web e2e

# The read-only Playwright suite on every PR that touches the web app or what it reads: the
# app built for devnet sakura, served locally, reading the public read fixture (e2e/README.md)
# through sakura's public DAPI. No secrets: every spec that signs or spends skips without
# E2E_WRITE. It is the regression gate for the UI — a spec that a deliberate UI change made
# stale fails in the PR that changed it, not in a nightly days later. A read the devnet
# rate-limits or drops is retried once (playwright.config.ts: `retries` under CI).
#
# It depends on sakura being up and seeded. When sakura is reset, this fails until the
# fixture is redeployed (forge-contracts/scripts/seed-v2-fixture.mjs) and its summary
# (forge-contracts/deployments/fixtures/devnet-sakura.json) committed, which is the signal.

on:
  # No `paths:` filter on pull_request: the Playwright check is REQUIRED by branch protection,
  # and a workflow that a path filter keeps from starting never reports it, which blocks the
  # merge forever. The `changes` job applies the same path list at job level instead.
  pull_request:
  push:
    branches: [master]
    paths:
      - 'forge-web/**'
      - 'forge-contracts/deployments/**'
      - '.github/workflows/web-e2e.yml'
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the suite runs. Always runs and always reports. On a pull request it diffs
  # the merge commit against its first parent (the base tip) and matches the paths that used to
  # be the workflow-level `pull_request.paths` filter. Any other event (push, workflow_dispatch)
  # always runs. Fails open: if the diff cannot be computed, run.
  changes:
    name: changes (web e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Did this PR touch the web app or what it reads?
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # For pull_request, HEAD is the synthetic merge commit; HEAD^1 is the base tip.
          if ! files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            echo "::warning::could not diff against the base; running the Playwright suite"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          pattern='^(forge-web/|forge-contracts/deployments/|forge-contracts/scripts/seed-v2-fixture\.mjs$|\.github/workflows/web-e2e\.yml$)'
          if printf '%s\n' "$files" | grep -Eq "$pattern"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "No web-relevant paths changed; the Playwright job is skipped."
          fi

  playwright:
    name: playwright (read-only, devnet sakura)
    needs: changes
    # `!cancelled()` replaces the implicit success() so a FAILED `changes` job runs this job
    # (and fails it in the first step) instead of skipping it, since a skipped job satisfies a
    # required check. Not `always()`: that would stop cancel-in-progress from cancelling a
    # superseded build.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    # The suite alone takes about 40 minutes against a busy devnet; 45 left the dash mirror step
    # no time and cancelled otherwise-green runs.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: forge-web
    env:
      E2E_DEVNET: sakura
    steps:
      # A failed `changes` job must not turn into a skipped (= passing) required check.
      - name: Fail when change detection did not succeed
        if: needs.changes.result != 'success'
        working-directory: ${{ github.workspace }}
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "::error::the changes job ended '$CHANGES_RESULT'; refusing to skip this required check"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: forge-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build for devnet sakura
        env:
          NEXT_PUBLIC_NETWORK: devnet
          NEXT_PUBLIC_DEVNET_NAME: sakura
        run: pnpm build
      # E2E_SKIP_BUILD serves the `out/` just built instead of building a second time. Both
      # projects run: chromium (every spec) and webkit (sign-in resilience).
      # The "showcase repos" specs read imported mirrors that are not yet re-created on sakura:
      # excluded until the re-mirror is announced (then drop the --grep-invert).
      - name: Playwright
        env:
          E2E_SKIP_BUILD: '1'
        run: pnpm exec playwright test --grep-invert "showcase repos"
      # The browse budgets on the dash mirror (page-budget.spec.ts bi-1, cb-1..cb-4): the requests
      # and bytes a large repo's code pages cost, which the read fixture is too small to show
      # (QW4-003 regressed with nothing in CI to catch it). The mirror on sakura has no DPNS name,
      # so its owner is named here; the specs skip without it. Sakura's Platform reset to
      # 5.0.0-beta.2 (2026-10-06) took the mirror with it: set E2E_SHOWCASE_DASHPAY to the new
      # mirror owner once the dash mirror is re-imported. Until then these specs skip.
      # Not run at all while E2E_SHOWCASE_DASHPAY (a repository variable) is unset: the specs
      # would skip anyway, but the suite's devnet readiness guard first waits up to six minutes.
      - name: Playwright (dash mirror budgets)
        if: (success() || failure()) && vars.E2E_SHOWCASE_DASHPAY != ''
        env:
          E2E_SKIP_BUILD: '1'
          E2E_SHOWCASE_DASHPAY: ${{ vars.E2E_SHOWCASE_DASHPAY }}
        run: pnpm exec playwright test page-budget.spec.ts --project chromium --grep "bi-1|cb-"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-report
          path: |
            forge-web/e2e/report
            forge-web/e2e/test-results
          retention-days: 7
