name: Contracts

# Offline validation of the three forge-v2 data contracts (forge-core, forge-collab,
# forge-community; tools/contract-validate, rs-dpp at the Platform tag its Cargo.toml pins,
# protocol 14): the full parse a node runs at registration, the registration reference checks
# (collab and community refer across to forge-core), sample documents against every
# propertyConstraints rule (the accept/refuse vectors of forge-contracts/vectors/rc1), the
# create-transition size against the 20,480-byte limit, the replace and index vectors of the RC2
# items, every combination of the RC2 flags (forge-contracts/schema/variants.py), and — for
# forge-core, which only ever changes by an in-place DataContractUpdate (platform-parity-spec
# §6) — that the update from the registered schema is accepted. negative.sh then proves the
# validator refuses each broken rule the design relies on. Last, every seed and verify script
# runs against an in-memory chain (seed-offline.mjs), and each document it writes is judged the
# same way.
on:
  pull_request:
    paths:
      - 'forge-contracts/contracts/**'
      - 'forge-contracts/schema/**'
      - 'forge-contracts/vectors/rc1/**'
      - 'forge-contracts/scripts/**'
      - 'tools/contract-validate/**'
      - '.github/workflows/contracts.yml'
  push:
    branches: [master]
    paths:
      - 'forge-contracts/contracts/**'
      - 'forge-contracts/schema/**'
      - 'forge-contracts/vectors/rc1/**'
      - 'forge-contracts/scripts/**'
      - 'tools/contract-validate/**'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

concurrency:
  group: contracts-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: contract-validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-contract-validate
    steps:
      - uses: actions/checkout@v4
      # The committed schemas and vectors are exactly what forge-contracts/schema/ generates
      - name: Schemas and vectors match their generators
        run: |
          python3 forge-contracts/schema/build.py --check
          python3 forge-contracts/schema/vectors.py --check
      # The registration-only reference checks a contract parse does not run (40121, 40122,
      # 40126, 40131, 40137): the JSON mirror, and its proof that it sees each of them
      - name: Registration where-check
        run: |
          python3 forge-contracts/schema/wherecheck.py
          python3 forge-contracts/schema/wherecheck.py --self-test
      # The toolchain platform v5.0.0-beta.1 pins (its rust-toolchain.toml)
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-contract-validate
          key: contract-validate-${{ hashFiles('tools/contract-validate/Cargo.lock') }}
      - name: Build the validator
        run: cargo +1.98.1 build -q --locked --manifest-path tools/contract-validate/Cargo.toml
      # registered/forge-core.v1.json is the schema registered fresh at the beta.7 wipe: a later
      # forge-core change must stay an in-place update of it
      - name: Validate forge-core (as an update of the registered schema), forge-collab and forge-community
        run: |
          "$CARGO_TARGET_DIR/debug/contract-validate" --vectors forge-contracts/vectors/rc1 \
            forge-contracts/contracts/forge-core.json \
            --expect-update forge-contracts/contracts/registered/forge-core.v1.json \
            forge-contracts/contracts/forge-collab.json \
            forge-contracts/contracts/forge-community.json
      - name: Negative mutations are refused
        run: tools/contract-validate/negative.sh
      # RC2: S1, S2, S3 and C1 are build.py flags decided at registration (fee probes), so every
      # combination of them must validate (with its own vectors) and fit the budget
      - name: Every RC2 flag combination validates
        run: python3 forge-contracts/schema/variants.py "$CARGO_TARGET_DIR/debug/contract-validate"
      # The seed and verify scripts, run against an in-memory chain: the rules that need chain
      # state (references, dense numbers, transitions, totals) are judged in JS, then rs-dpp
      # judges every document they write as an rc1 vector
      - name: Seed scripts write RC1 documents
        run: |
          node --test forge-contracts/scripts/lib/offline-chain.test.mjs
          node forge-contracts/scripts/seed-offline.mjs --out "$RUNNER_TEMP/seed-vectors"
          "$CARGO_TARGET_DIR/debug/contract-validate" --vectors "$RUNNER_TEMP/seed-vectors" \
            forge-contracts/contracts/forge-core.json \
            forge-contracts/contracts/forge-collab.json \
            forge-contracts/contracts/forge-community.json
      # Offline: the deploy script's id derivation matches the validator's known answer, and every
      # schema it registers loads with forge-core's id substituted (no SDK, no network)
      - name: Deploy script self-test
        run: node forge-contracts/scripts/deploy-v2.mjs --self-test
