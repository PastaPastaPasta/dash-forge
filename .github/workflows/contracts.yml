name: Contracts

# Offline validation of the three forge-v2 data contracts (forge-core, forge-collab,
# forge-community; tools/contract-validate, rs-dpp at the Platform tag its Cargo.toml pins,
# protocol 14): the full parse a node runs at registration, the registration reference checks
# (collab and community refer across to forge-core), sample documents against every
# propertyConstraints rule (the accept/refuse vectors of forge-contracts/vectors/rc1), the
# create-transition size against the 20,480-byte limit, the replace and index vectors of the RC2
# items, every combination of the RC2 flags (forge-contracts/schema/variants.py), and — for
# each contract, which only ever changes by an in-place DataContractUpdate (platform-parity-spec
# §6, UPDATE-1) — that the update from its registered schema is accepted. negative.sh then proves the
# validator refuses each broken rule the design relies on. The four-contract mainnet set, committed
# under forge-contracts/contracts/mainnet/ (`build.py --mainnet` writes it, `build.py --check` compares
# it: forge-meta and the mixed-visibility items of dash-forge-qa design/mixed-visibility/DESIGN.md
# rev 4.1 §8.3) gets the same checks, and variants.py runs every combination of its items. Last,
# every seed and verify script, and the RC1 rule suite's case table (rc1-live.mjs --offline), runs
# against an in-memory chain on both sets, and each document they write is judged the same way. The job is behind a `changes` gate so `contract-validate` can be a required
# check (a skipped run satisfies it; a failed gate does not).
on:
  # No `paths:` filter on pull_request: `contract-validate` is meant to be a REQUIRED check, and a
  # workflow that a path filter keeps from starting never reports it, which blocks the merge forever.
  # The `changes` job applies the path list at job level instead (INFR-V-03).
  pull_request:
  push:
    branches: [master]
    paths:
      - 'forge-contracts/**'
      - 'tools/contract-validate/**'
      # (check-release-network.mjs --self-test parses the web build's network out of it)
      - 'forge-web/scripts/ipfs-release.sh'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

concurrency:
  group: contracts-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether `contract-validate` runs. Always runs and always reports. On a pull request it diffs
  # the merge commit against its first parent (the base tip) and matches the paths the workflow-level
  # `pull_request.paths` filter used to; keep this list and the `push` list above in step. Any other
  # event (push, workflow_dispatch) always runs. Fails open: if the diff cannot be computed, run.
  changes:
    name: changes (contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Did this PR touch the contracts, their tools, the release network or this workflow?
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # For pull_request, HEAD is the synthetic merge commit; HEAD^1 is the base tip.
          if ! files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            echo "::warning::could not diff against the base; running contract-validate"
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          pattern='^(forge-contracts/|tools/contract-validate/|forge-web/scripts/ipfs-release\.sh$|\.github/workflows/contracts\.yml$)'
          if printf '%s\n' "$files" | grep -Eq "$pattern"; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
            echo "No contract-relevant paths changed; contract-validate is skipped."
          fi

  validate:
    name: contract-validate
    needs: changes
    # `!cancelled()` replaces the implicit success() so a FAILED `changes` job runs this job (and fails
    # it in the first step) instead of skipping it, since a skipped job satisfies a required check.
    # Not `always()`: that would stop cancel-in-progress from cancelling a superseded build.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.contracts == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-contract-validate
    steps:
      # A failed `changes` job must not turn into a skipped (= passing) required check.
      - name: Fail when change detection did not succeed
        if: needs.changes.result != 'success'
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "::error::the changes job ended '$CHANGES_RESULT'; refusing to skip this required check"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The committed schemas and vectors are exactly what forge-contracts/schema/ generates
      - name: Schemas and vectors match their generators
        run: |
          python3 forge-contracts/schema/build.py --check
          python3 forge-contracts/schema/vectors.py --check
      # build.py --check also compares contracts/registered/<network>/ with the set each network
      # registered (NETWORK_REGISTRATIONS, empty until the registration commit): its logic, tested
      - name: Registered-set check logic
        run: python3 forge-contracts/schema/registered_test.py
      # The registration-only reference checks a contract parse does not run (40121, 40122,
      # 40126, 40131, 40137): the JSON mirror, and its proof that it sees each of them
      - name: Registration where-check
        run: |
          python3 forge-contracts/schema/wherecheck.py
          python3 forge-contracts/schema/wherecheck.py --self-test
          python3 forge-contracts/schema/vectors.py --mainnet --out "$RUNNER_TEMP/mainnet-vectors"
          python3 forge-contracts/schema/wherecheck.py forge-contracts/contracts/mainnet
          python3 forge-contracts/schema/wherecheck.py --self-test forge-contracts/contracts/mainnet
      # The toolchain platform v5.0.0-rc.3 pins (its rust-toolchain.toml)
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-contract-validate
          key: contract-validate-release-${{ hashFiles('tools/contract-validate/Cargo.lock') }}
      # Release: variants.py runs it on every mainnet flag combination (about 1,700 runs)
      - name: Build the validator
        run: cargo +1.98.1 build -q --release --locked --manifest-path tools/contract-validate/Cargo.toml
      # registered/<contract>.v1.json are the schemas registered fresh at the v5 re-cut (devnet sakura, 2026-10-01): every
      # later change to any of the three must stay an in-place update of them (UPDATE-1, roadmap D4).
      # (Sakura was re-registered fresh on 2026-10-13 from the then-current schema, so these copies
      # describe its first registration; they are kept as the devnet baseline, not moved.)
      - name: Validate forge-core, forge-collab and forge-community (each as an update of its registered schema)
        run: |
          "$CARGO_TARGET_DIR/release/contract-validate" --vectors forge-contracts/vectors/rc1 \
            forge-contracts/contracts/forge-core.json \
            --expect-update forge-contracts/contracts/registered/forge-core.v1.json \
            forge-contracts/contracts/forge-collab.json \
            --expect-update forge-contracts/contracts/registered/forge-collab.v1.json \
            forge-contracts/contracts/forge-community.json \
            --expect-update forge-contracts/contracts/registered/forge-community.v1.json
      # Each production network's contracts only ever change by additive updates of what it registered
      # (CONT-03): contracts/registered/<network>/ holds the byte copies (freeze-registered.mjs writes
      # them at the registration commit); the set the network's record names must stay an in-place
      # update of them. No directory yet (before the registration commit): nothing to check.
      - name: Validate each registered network's set as an update of its registration
        run: forge-contracts/scripts/validate-registered.sh "$CARGO_TARGET_DIR/release/contract-validate"
      # The mainnet registration: four contracts, forge-meta last, each keeping >= 2,000 B of room (D44)
      - name: Validate the four-contract mainnet set
        run: |
          python3 forge-contracts/schema/build.py --mainnet --out "$RUNNER_TEMP/mainnet" \
            --validate "$CARGO_TARGET_DIR/release/contract-validate"
          for f in forge-core forge-collab forge-community forge-meta; do
            cmp "$RUNNER_TEMP/mainnet/$f.json" "forge-contracts/contracts/mainnet/$f.json"
          done
          "$CARGO_TARGET_DIR/release/contract-validate" --vectors "$RUNNER_TEMP/mainnet-vectors" \
            forge-contracts/contracts/mainnet/forge-{core,collab,community,meta}.json
      # The testnet freeze's update guards (mainnet_pinned_gates): with every guarded bound loosened as an
      # update could loosen it, each document only the loosened bound admits is still refused, by its rule
      - name: Update guards hold on loosened bounds
        run: |
          python3 forge-contracts/schema/vectors.py --mainnet --out "$RUNNER_TEMP/mainnet-vectors" --guards "$RUNNER_TEMP/guards"
          "$CARGO_TARGET_DIR/release/contract-validate" --vectors "$RUNNER_TEMP/guards/vectors" \
            "$RUNNER_TEMP"/guards/contracts/forge-{core,collab,community,meta}.json
      - name: Negative mutations are refused
        run: tools/contract-validate/negative.sh
      # RC2: S1, S2, S3, C1 and MOD are build.py flags decided at registration (fee probes), so every
      # combination of them must validate (with its own vectors) and fit the budget; so must each
      # combination of the rider flags (QW-069, QW2-010) with every RC2 item on, and every allowed
      # combination of the mainnet items (build.MV_FLAGS), with and without forge-meta
      - name: Every RC2 and mainnet flag combination validates
        run: python3 forge-contracts/schema/variants.py "$CARGO_TARGET_DIR/release/contract-validate"
      # The RC2 registration fee probes (rc1-fee-probe.mjs --rc2): their six throwaway contracts,
      # cut from the build.py variants, differ in the gated item alone and parse under v5, and the
      # documents the live run writes are accepted
      - name: RC2 fee-probe contracts validate
        run: |
          node --test forge-contracts/scripts/lib/rc2-probe.test.mjs
          node forge-contracts/scripts/rc1-fee-probe.mjs --rc2 --emit "$RUNNER_TEMP/rc2-probe"
          "$CARGO_TARGET_DIR/release/contract-validate" --vectors "$RUNNER_TEMP/rc2-probe/vectors" \
            "$RUNNER_TEMP"/rc2-probe/contracts/rc2-*.json
      # The testnet freeze's fee probes (rc1-fee-probe.mjs --freeze): the event and config probe
      # contracts, cut from the --mainnet build, differ in the gated index alone and parse under v5
      - name: Freeze fee-probe contracts validate
        run: |
          node --test forge-contracts/scripts/lib/freeze-probe.test.mjs
          node forge-contracts/scripts/rc1-fee-probe.mjs --freeze --emit "$RUNNER_TEMP/freeze-probe"
          "$CARGO_TARGET_DIR/release/contract-validate" --vectors "$RUNNER_TEMP/freeze-probe/vectors" \
            "$RUNNER_TEMP"/freeze-probe/contracts/*.json
      # The seed and verify scripts, run against an in-memory chain: the rules that need chain
      # state (references, dense numbers, transitions, totals) are judged in JS, then rs-dpp
      # judges every document they write as an rc1 vector
      - name: Seed scripts write RC1 documents
        run: |
          node --test forge-contracts/scripts/lib/offline-chain.test.mjs forge-contracts/scripts/lib/seed-io.test.mjs
          node forge-contracts/scripts/seed-offline.mjs --out "$RUNNER_TEMP/seed-vectors"
          "$CARGO_TARGET_DIR/release/contract-validate" --vectors "$RUNNER_TEMP/seed-vectors" \
            forge-contracts/contracts/forge-core.json \
            forge-contracts/contracts/forge-collab.json \
            forge-contracts/contracts/forge-community.json
      # The same scripts against the four-contract mainnet set (the one testnet registers): they
      # feature-detect what the loaded contracts declare (asMember with mRole, no topic vis, a
      # release's targetOid, forge-meta routing), write each document on a first run and nothing
      # on the rerun, and rs-dpp judges every document they wrote
      - name: Seed scripts write mainnet-set documents
        run: |
          node forge-contracts/scripts/seed-offline.mjs --contracts forge-contracts/contracts/mainnet \
            --out "$RUNNER_TEMP/seed-vectors-mainnet"
          "$CARGO_TARGET_DIR/release/contract-validate" --vectors "$RUNNER_TEMP/seed-vectors-mainnet" \
            forge-contracts/contracts/mainnet/forge-{core,collab,community,meta}.json
      # The RC1 rule suite's case table (rc1-live.mjs --offline) on the devnet set and on the
      # four-contract mainnet set testnet registers (QA-03): it routes each type by what the loaded
      # contracts hold and shapes each document as they declare; the in-memory chain judges every case
      # that needs chain state, and rs-dpp judges every document it writes (the refusals by a rule or
      # the schema included). rc1-empty-aggregates routes its probes on both sets the same way.
      - name: RC1 rule suite case table on both sets
        run: |
          node forge-contracts/scripts/rc1-live.mjs --offline --out "$RUNNER_TEMP/rc1-offline"
          "$CARGO_TARGET_DIR/release/contract-validate" --vectors "$RUNNER_TEMP/rc1-offline" \
            forge-contracts/contracts/forge-core.json \
            forge-contracts/contracts/forge-collab.json \
            forge-contracts/contracts/forge-community.json
          node forge-contracts/scripts/rc1-live.mjs --offline --contracts forge-contracts/contracts/mainnet \
            --out "$RUNNER_TEMP/rc1-offline-mainnet"
          "$CARGO_TARGET_DIR/release/contract-validate" --vectors "$RUNNER_TEMP/rc1-offline-mainnet" \
            forge-contracts/contracts/mainnet/forge-{core,collab,community,meta}.json
          node forge-contracts/scripts/rc1-empty-aggregates.mjs --offline
          node forge-contracts/scripts/rc1-empty-aggregates.mjs --offline --contracts forge-contracts/contracts/mainnet
      # Offline: the deploy script's id derivation matches the validator's known answer, and every
      # schema it registers loads with forge-core's id substituted (no SDK, no network)
      - name: Deploy script self-test
        run: |
          node forge-contracts/scripts/deploy-v2.mjs --self-test
          node forge-contracts/scripts/deploy-v2.mjs --self-test --contracts forge-contracts/contracts/mainnet
      # The deploy script end to end against an in-memory platform (lib/fake-platform.mjs): the
      # four-contract registration and its record, resume after a crash, the nonce ledger, the set,
      # network and chain refusals, the testnet/mainnet preconditions and --force-new guard, the
      # same-id restore (--replay) after a Platform reset; and
      # the snapshot script's record and target rules. No SDK, no network, no key.
      - name: Deploy script offline tests
        run: |
          node --test forge-contracts/scripts/deploy-v2.test.mjs forge-contracts/scripts/deploy-v2-replay.test.mjs forge-contracts/scripts/snapshot-contracts.test.mjs
      # Offline: the seed-list refresher (M-DAPI, CONT-12) against a captured /masternodes body:
      # only protocol-14 nodes, the stale-node rules, and the shape of every recorded seed list.
      # The live probe is `refresh-dapi.mjs --network testnet --check`, run by hand or nightly.
      - name: Seed-list refresher
        run: node --test forge-contracts/scripts/lib/refresh-dapi.test.mjs
      # The deployment records hold their rules (ids derive from owner and nonce; a named set, its frozen
      # copy and the nonce ledger agree; a testnet or mainnet record is complete), freeze-registered.mjs
      # copies byte for byte and never replaces, and release.yml's guard (CLIE-02): a final release needs a
      # registered forge-v2 set on testnet and a non-devnet web build. No SDK, no network.
      - name: Deployment records, registered-set freeze and release guard
        run: |
          node --test forge-contracts/scripts/lib/deployments.test.mjs forge-contracts/scripts/lib/freeze-registered.test.mjs
          node forge-contracts/scripts/check-release-network.mjs --self-test
      # Offline: which network and record a live tool targets, and the production-write policy
      # (rc1-live, mv-live, rc1-empty-aggregates and rc1-fee-probe refuse the live testnet record,
      # a --record without the scratch stamp, and mainnet altogether; QA-14), mv-live's sealing helpers against the committed vectors, and the CLI
      # suite's testnet rules (no DEPLOYER, no July pool, an explicit funding key; QA-05, HYGI-12)
      - name: Live tool targets and production refusals
        run: |
          shellcheck -x -P e2e/cli e2e/cli/config.sh e2e/cli/test-config.sh e2e/cli/run.sh
          bash e2e/cli/test-config.sh
          node --test forge-contracts/scripts/lib/target.test.mjs
          node forge-contracts/scripts/mv-live.mjs --self-test
          for t in "rc1-live --identities /nonexistent" "mv-live --identities /nonexistent" "rc1-empty-aggregates" "rc1-fee-probe --identity /nonexistent"; do
            read -r tool rest <<<"$t"
            # shellcheck disable=SC2086 # the words of one tool's command line
            out=$(node "forge-contracts/scripts/$tool.mjs" --network testnet $rest 2>&1 || true)
            grep -q 'refusing to run against a live registration' <<<"$out" || { echo "$tool did not refuse the live testnet record: $out"; exit 1; }
          done
          # none of the four runs on mainnet for now (real DASH, no plan), --live-target included
          for t in "rc1-live --identities /nonexistent" "mv-live --identities /nonexistent" "mv-live --live-target --identities /nonexistent" "rc1-empty-aggregates" "rc1-fee-probe --identity /nonexistent"; do
            read -r tool rest <<<"$t"
            # shellcheck disable=SC2086 # the words of one tool's command line
            out=$(node "forge-contracts/scripts/$tool.mjs" --network mainnet $rest 2>&1 || true)
            grep -q 'network mainnet is not supported for' <<<"$out" || { echo "$tool did not refuse mainnet: $out"; exit 1; }
          done
