name: Rust

# The Rust workspace (forge-core, git-remote-dash, dg, forge-relay, forge-import) builds
# against a PINNED, IMMUTABLE Dash Platform tag declared in the root Cargo.toml — cargo
# fetches it, so there is no sibling `../platform` checkout to arrange and no branch that
# can move underneath a green build. Cargo.lock pins the exact revision.
#
# The dependency tree (grovedb / tenderdash / rocksdb) is large, so the full build runs on
# PRs that actually touch Rust plus nightly — not on every push to unrelated paths.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      # Compiled into the binaries, not just test data: forge-core include_str!s
      # templates/repo-v1.json and dg include_str!s deployments/testnet.json, and the
      # conformance test loads vectors/.
      - 'forge-contracts/**'
      - '.github/workflows/rust.yml'
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'forge-contracts/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

concurrency:
  # schedule, workflow_dispatch and push-to-master all resolve github.ref to
  # refs/heads/master, so keying on ref alone would let the nightly cancel a master build
  # (and vice versa). Only superseded PR runs are worth cancelling.
  group: rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust build + test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # `tenderdash-proto` (a transitive dep of the Platform SDK) compiles .proto files in
      # its build script and needs protoc on PATH; without it the whole workspace fails to
      # build with a message that does not mention cargo at all.
      # Ubuntu's `protobuf-compiler` package is protoc 3.21.x, whose `libprotoc 3.21.12`
      # version string the tenderdash proto-compiler cannot parse ("invalid float literal") —
      # protobuf renumbered to `libprotoc <major>.<minor>` at v22. Install a pinned modern
      # release directly so the version is explicit and reproducible.
      - name: Install protoc
        env:
          PROTOC_VERSION: '28.3'
        run: |
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `--locked` on EVERY cargo invocation, not as a trailing check: cargo re-resolves and
      # rewrites Cargo.lock in place, so a check placed after clippy/test would compare the
      # lockfile against a copy cargo had already fixed up and could never fail. With
      # --locked, a dependency change whose lockfile was not committed fails at the first
      # cargo command, with cargo's own precise message.
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --locked --workspace
