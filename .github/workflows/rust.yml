name: Rust

# The Rust workspace (forge-core, git-remote-dash, dg, forge-relay, forge-import) builds
# against a PINNED, IMMUTABLE Dash Platform tag declared in the root Cargo.toml — cargo
# fetches it, so there is no sibling `../platform` checkout to arrange and no branch that
# can move underneath a green build. Cargo.lock pins the exact revision.
#
# The dependency tree (grovedb / tenderdash / rocksdb) is large, so the full build runs on
# PRs that actually touch Rust plus nightly — not on every push to unrelated paths.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'forge-contracts/vectors/**'
      - '.github/workflows/rust.yml'
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'forge-contracts/vectors/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust build + test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # `tenderdash-proto` (a transitive dep of the Platform SDK) compiles .proto files in
      # its build script and needs protoc on PATH; without it the whole workspace fails to
      # build with a message that does not mention cargo at all.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # Cargo.lock is committed precisely so a build is reproducible; a PR that changes a
      # dependency without committing the resulting lockfile would silently un-pin it.
      - name: Cargo.lock is up to date
        run: |
          cargo metadata --format-version 1 --locked >/dev/null \
            || { echo "::error::Cargo.lock is out of date — run 'cargo check' and commit Cargo.lock"; exit 1; }
