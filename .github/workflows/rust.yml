name: Rust

# The Rust workspace (forge-core, git-remote-dash, dg, forge-relay, forge-import) builds
# against a PINNED, IMMUTABLE Dash Platform tag declared in the root Cargo.toml — cargo
# fetches it, so there is no sibling `../platform` checkout to arrange and no branch that
# can move underneath a green build. Cargo.lock pins the exact revision.
#
# The dependency tree (grovedb / tenderdash / rocksdb) is large, so the full build runs on
# PRs that actually touch Rust plus nightly — not on every push to unrelated paths.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      # Compiled into every binary by the crates' build.rs (`--version` stamping).
      - 'build-support/**'
      # Compiled into the binaries, not just test data: forge-core embeds every
      # deployments/*.json (build.rs), and the conformance test loads vectors/.
      - 'forge-contracts/**'
      # The storage fixture the `storage-it` steps run against.
      - 'infra/**'
      - 'Makefile'
      - '.github/workflows/rust.yml'
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      # Compiled into every binary by the crates' build.rs (`--version` stamping).
      - 'build-support/**'
      - 'forge-contracts/**'
      # The storage fixture the `storage-it` steps run against.
      - 'infra/**'
      - 'Makefile'
      - '.github/workflows/rust.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

concurrency:
  # schedule, workflow_dispatch and push-to-master all resolve github.ref to
  # refs/heads/master, so keying on ref alone would let the nightly cancel a master build
  # (and vice versa). Only superseded PR runs are worth cancelling.
  group: rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust build + test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The storage fixture (RustFS + kubo + nginx, infra/docker-compose.yml), started
      # first: a fresh runner has no cached images, so this is what proves the pinned images
      # still pull (the MinIO ones stopped pulling and nothing noticed), and the containers
      # come up while the workspace builds.
      - name: Start the storage fixture
        run: docker compose -f infra/docker-compose.yml up -d

      # `tenderdash-proto` (a transitive dep of the Platform SDK) compiles .proto files in
      # its build script and needs protoc on PATH; without it the whole workspace fails to
      # build with a message that does not mention cargo at all.
      # Ubuntu's `protobuf-compiler` package is protoc 3.21.x, whose `libprotoc 3.21.12`
      # version string the tenderdash proto-compiler cannot parse ("invalid float literal") —
      # protobuf renumbered to `libprotoc <major>.<minor>` at v22. Install a pinned modern
      # release directly so the version is explicit and reproducible.
      - name: Install protoc
        env:
          PROTOC_VERSION: '28.3'
        run: |
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      # The toolchain comes from rust-toolchain.toml, not from a floating `@stable`:
      # `clippy -- -D warnings` fails whenever a new stable ships a lint, with no change to
      # this repository, and the version that lints a commit should be a property of that
      # commit. rustup reads the file, so every cargo command below uses the pinned version.
      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show active-toolchain
          cargo --version && cargo clippy --version && cargo fmt --version

      - uses: Swatinem/rust-cache@v2

      # `--locked` on EVERY cargo invocation, not as a trailing check: cargo re-resolves and
      # rewrites Cargo.lock in place, so a check placed after clippy/test would compare the
      # lockfile against a copy cargo had already fixed up and could never fail. With
      # --locked, a dependency change whose lockfile was not committed fails at the first
      # cargo command, with cargo's own precise message.
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --locked --workspace

      # The bring-your-own-storage integration tests against the fixture started above:
      # localhost only, no secrets, no Platform spend. FORGE_IT_* (set by the target) make
      # an unreachable fixture a failure, never a skip.
      - name: storage-it
        run: make storage-it

      - name: Storage fixture logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail 200

  # The Windows-only code paths (no key handoff; the console prompt; the pre-flight refusal
  # for a sealed key with no console) compile and pass their unit tests. The release builds
  # Windows binaries, and the Linux job above never compiles `cfg(not(unix))`.
  windows:
    name: windows check + sealed-key tests
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # aws-lc-sys needs NASM for x86_64 Windows; use the prebuilt objects it ships.
      AWS_LC_SYS_PREBUILT_NASM: '1'
      PROTOC_VERSION: '28.3'
    steps:
      - uses: actions/checkout@v4
      # The Platform monorepo's paths exceed MAX_PATH under the default CARGO_HOME.
      - name: Shorten CARGO_HOME
        run: |
          git config --global core.longpaths true
          printf '%s\n' 'CARGO_HOME=C:\ch' >> "$GITHUB_ENV"
          printf '%s\n' 'C:\ch\bin' >> "$GITHUB_PATH"
      - name: Install protoc
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/protoc"
          mkdir -p "$tmp"
          curl -fsSLo "$tmp/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-win64.zip"
          7z x -y -bso0 -bsp0 "-o$tmp" "$tmp/protoc.zip"
          echo "$tmp/bin" >> "$GITHUB_PATH"
          echo "PROTOC=$tmp/bin/protoc.exe" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL https://win.rustup.rs/x86_64 -o "$RUNNER_TEMP/rustup-init.exe"
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
          fi
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: check (Windows cfg paths)
        run: cargo check --locked -p forge-core -p dg -p git-remote-dash --all-targets
      - name: sealed-key unit tests
        run: |
          cargo test --locked -p forge-core --lib -- sealed:: key_handoff
          cargo test --locked -p dg --bin dg -- git::tests::without_a_handoff
