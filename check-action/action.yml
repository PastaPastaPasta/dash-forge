# Dash Forge check action: reports a GitHub Actions job's result as a Forge check run (a
# `checkRun` document) on the same commit of the repository's Forge mirror. Forge mirrors are
# byte-identical git, so the GitHub commit id IS the Forge commit id. See check-action/README.md.
name: Dash Forge check
description: Report this GitHub Actions job's result as a Dash Forge check run on the mirrored commit.
author: PastaPastaPasta
branding:
  icon: check-circle
  color: blue

inputs:
  repo:
    description: "Forge repository: <owner identity id or DPNS name>/<name>, or dash://<owner>/<name>."
    required: true
  name:
    description: "The check's name on Forge. Default: `<workflow> / <job>`, plus the matrix values of a matrix leg (`CI / test (ubuntu, 1.80)`)."
    default: ""
  status:
    description: "queued, in_progress or completed (default completed)."
    default: completed
  conclusion:
    description: "With status completed: success, failure, neutral, cancelled, skipped, timed_out, action_required or stale. Default: from job-status."
    default: ""
  job-status:
    description: "The job's status, to derive the conclusion from: pass `job.status` (success, failure or cancelled)."
    default: ""
  sha:
    description: "The commit to report on (default: the pull request head, else github.sha)."
    default: ""
  summary:
    description: "A one-line summary (≤ 1000 characters). Default: the workflow, job and run attempt."
    default: ""
  details-url:
    description: "Link back to the run, https only (default: this workflow run on GitHub). Left out on a private repository."
    default: ""
  log:
    description: "A file to upload as the run's log (with log-storage). Content-addressed; the check run records its URL and SHA-256."
    default: ""
  log-storage:
    description: "The storage profile the log goes to: its name in a storage.toml the job provides (see check-action/README.md)."
    default: ""
  public-log:
    description: "No longer has any effect: a private repository's check run cannot carry a log, so none is uploaded there."
    default: "false"
  network:
    description: "mainnet, testnet or devnet. The default is the devnet the hosted site targets; Forge is not deployed on mainnet yet."
    default: devnet
  devnet-name:
    description: "Devnet name, used only when network is devnet: lowercase letters, digits and -."
    default: sakura
  version:
    description: "Dash Forge release to install (the release this action version pins, kept equal to the workspace version). Empty: install 'true' builds dg from source."
    default: "0.1.0"
  install:
    description: "true: install release `version`, or build dg from this action's own source (the ref in uses:) when `version` is empty. source: always build from source. false: use the dg already on PATH."
    default: "true"
  build-cache:
    description: "A source build reuses compiled dependencies from actions/cache, trusted like any other cache of this repository. false: compile everything every run."
    default: "true"
  fail-on-error:
    description: "true: fail the step when the report cannot be written. Default false: a warning, so a Forge outage never fails your CI."
    default: "false"

outputs:
  document-id:
    description: "The checkRun document id."
    value: ${{ steps.report.outputs.document-id }}
  sha:
    description: "The commit the check run is on (the PR head for pull_request runs)."
    value: ${{ steps.resolve.outputs.sha }}
  name:
    description: "The check's name on Forge."
    value: ${{ steps.resolve.outputs.name }}
  url:
    description: "The Forge commit page that shows the run."
    value: ${{ steps.report.outputs.url }}
  action:
    description: "created, updated or unchanged (empty when nothing was written)."
    value: ${{ steps.report.outputs.action }}
  dg:
    description: "The dg the action installed or built (empty with install 'false'), for later steps of the job."
    value: ${{ steps.plan.outputs.dg }}

runs:
  using: composite
  steps:
    - name: Resolve the report
      id: resolve
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_CONCLUSION: ${{ inputs.conclusion }}
        INPUT_JOB_STATUS: ${{ inputs.job-status }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_DETAILS_URL: ${{ inputs.details-url }}
        INPUT_LOG: ${{ inputs.log }}
        INPUT_LOG_STORAGE: ${{ inputs.log-storage }}
        INPUT_PUBLIC_LOG: ${{ inputs.public-log }}
        INPUT_NETWORK: ${{ inputs.network }}
        INPUT_DEVNET_NAME: ${{ inputs.devnet-name }}
        INPUT_INSTALL: ${{ inputs.install }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_BUILD_CACHE: ${{ inputs.build-cache }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # A matrix leg: its index goes into the run id and its values into the default name,
        # so the legs of one job never overwrite each other.
        JOB_TOTAL: ${{ strategy.job-total }}
        JOB_INDEX: ${{ strategy.job-index }}
        MATRIX_JSON: ${{ toJSON(matrix) }}
      run: bash "$GITHUB_ACTION_PATH/resolve.sh"

    # dg is installed once per job: a second use of the action finds it and installs nothing.
    # The Mirror Action's install-forge.sh (same ref) decides between the pinned release and a
    # build of this action's own source.
    - name: Choose how to install dg
      id: plan
      if: inputs.install != 'false'
      shell: bash
      env:
        INPUT_INSTALL: ${{ inputs.install }}
        INPUT_VERSION: ${{ inputs.version }}
        FORGE_BINARIES: dg
        FORGE_INSTALL_SEVERITY: ${{ inputs.fail-on-error == 'true' && 'error' || 'warning' }}
      run: |
        if [ "$INPUT_INSTALL" = source ] || [ -z "$INPUT_VERSION" ]; then dir=source; else dir=$INPUT_VERSION; fi
        # The source build supports Linux runners only: say so up front, and let the report step
        # warn or fail as fail-on-error asks.
        if [ "$dir" = source ] && [ "$RUNNER_OS" != Linux ]; then
          echo "failed=dg can be built from source on Linux runners only (this one is $RUNNER_OS). Report from a Linux job, or put dg on PATH and set install: 'false'" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        dir="$RUNNER_TEMP/forge-check-bin-$dir"
        { echo "dir=$dir"; echo "dg=$dir/dg"; } >>"$GITHUB_OUTPUT"
        if [ -x "$dir/dg" ]; then echo "method=installed" >>"$GITHUB_OUTPUT"; exit 0; fi
        bash "$GITHUB_ACTION_PATH/../action/install-forge.sh" plan ||
          echo "failed=could not tell how to install dg (the log above says why)" >>"$GITHUB_OUTPUT"

    - name: Install Dash Forge ${{ inputs.version }}
      id: install
      if: steps.plan.outputs.method == 'release'
      shell: bash
      env:
        DASH_FORGE_VERSION: ${{ inputs.version }}
        DASH_FORGE_INSTALL_DIR: ${{ steps.plan.outputs.dir }}
        DASH_FORGE_BINARIES: dg
        DASH_FORGE_ATTESTATION: auto
        GH_TOKEN: ${{ github.token }}
      # A failed install is reported by the report step, which honours fail-on-error.
      run: |
        if ! sh "$GITHUB_ACTION_PATH/../install.sh" >&2; then
          echo "failed=dg $DASH_FORGE_VERSION could not be installed (if that release is not published, set install: 'source')" >>"$GITHUB_OUTPUT"
        fi

    # A source build. Its compiled dependencies are cached across runs (build-cache), shared
    # with the Mirror Action's.
    - name: Restore the Dash Forge build cache
      id: build-cache
      if: steps.plan.outputs.method == 'source' && inputs.build-cache == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          ${{ runner.temp }}/dash-forge-build
        key: ${{ steps.plan.outputs.cache-key }}
        restore-keys: |
          dash-forge-build@${{ runner.os }}-${{ runner.arch }}@

    - name: Build dg from the action's source
      id: build
      if: steps.plan.outputs.method == 'source'
      shell: bash
      env:
        FORGE_BINARIES: dg
        FORGE_BIN_DIR: ${{ steps.plan.outputs.dir }}
        FORGE_TARGET_DIR: ${{ runner.temp }}/dash-forge-build
        FORGE_TOOLS_DIR: ${{ runner.temp }}/forge-check-tools
        DASH_FORGE_ACTION_REF: ${{ github.action_ref }}
        FORGE_INSTALL_SEVERITY: ${{ inputs.fail-on-error == 'true' && 'error' || 'warning' }}
      # A failed build is reported by the report step, which honours fail-on-error.
      run: |
        if ! bash "$GITHUB_ACTION_PATH/../action/install-forge.sh" build; then
          echo "failed=dg could not be built from the action's source (the log above says why)" >>"$GITHUB_OUTPUT"
        fi

    - name: Save the Dash Forge build cache
      if: steps.plan.outputs.method == 'source' && inputs.build-cache == 'true' && steps.build-cache.outputs.cache-hit != 'true' && steps.build.outputs.failed == ''
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          ${{ runner.temp }}/dash-forge-build
        key: ${{ steps.plan.outputs.cache-key }}

    - name: Report to Forge
      id: report
      shell: bash
      env:
        FORGE_ARGS_FILE: ${{ steps.resolve.outputs.args-file }}
        FORGE_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        FORGE_INSTALL_FAILED: ${{ steps.plan.outputs.failed || steps.install.outputs.failed || steps.build.outputs.failed }}
        DG_BIN: ${{ steps.plan.outputs.dg || 'dg' }}
      run: bash "$GITHUB_ACTION_PATH/report.sh"
