[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/git-remote-dash",
    "crates/dg",
    "crates/forge-relay",
    "crates/forge-import",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PastaPastaPasta/dash-forge"
rust-version = "1.98"

# Shared dependency versions. Individual crates opt in with `<dep>.workspace = true`.
#
# The Dash Platform Rust SDK (rs-sdk / rs-dpp, from the pinned git tag below) is consumed
# ONLY by forge-core::platform. The binaries do not depend on it directly — keep it that
# way so the CLI/helper stay fast to build.
[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Dash Platform Rust SDK — pinned to an IMMUTABLE upstream tag, fetched by cargo.
#
# These were path deps on a sibling `../platform` checkout, which meant a fresh clone of
# this repo could not build at all and two developers could compile the same commit
# against different Platform source. A git dep + tag makes the SDK revision part of this
# repo's own history (and of Cargo.lock), so `git clone && cargo build` is reproducible
# with no out-of-tree setup.
#
# To develop against a local Platform checkout, override without editing this file, using
# `[patch]` on the git URL — cargo's `paths` override does NOT apply to git sources. All
# five packages must be patched together or the graph ends up with two copies of dpp /
# drive-proof-verifier and forge-core stops compiling. See docs/BUILDING.md.
#
# Bumping the tag: change PLATFORM_TAG below in ALL FIVE entries together, run
# `cargo update -p dash-sdk`, and commit the resulting Cargo.lock.
# PLATFORM_TAG = v4.2.0-beta.4
#
# mocks/offline-testing are dropped (default-features = false) so only the live network
# client is built. `dapi-grpc` with the `client` feature is pulled in directly to keep the
# network transport + TLS stubs compiled after dropping the SDK's default feature set.
dash-sdk = { git = "https://github.com/dashpay/platform.git", tag = "v4.2.0-beta.4", default-features = false }
dapi-grpc = { git = "https://github.com/dashpay/platform.git", tag = "v4.2.0-beta.4", default-features = false, features = ["core", "platform", "client"] }
drive-proof-verifier = { git = "https://github.com/dashpay/platform.git", tag = "v4.2.0-beta.4", default-features = false }
rs-sdk-trusted-context-provider = { git = "https://github.com/dashpay/platform.git", tag = "v4.2.0-beta.4" }
simple-signer = { git = "https://github.com/dashpay/platform.git", tag = "v4.2.0-beta.4" }

# Workspace-wide lints. CI runs `cargo clippy --all-targets -- -D warnings`, which
# promotes every `warn` below to a hard error. Kept pragmatic: `all` + a selected
# slice of `pedantic`, with the noisiest pedantic lints allowed back.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic allow-list: these fire on ordinary, correct scaffold code.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
