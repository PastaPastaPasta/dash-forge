# Self-host forge-gateway: `docker compose up -d` in this directory, with a `.env` next to it
# (see docs/hosting/forge-gateway.md for every variable). The gateway listens on
# 127.0.0.1:8080 of the host: put TLS in front of it (a Cloudflare tunnel, Caddy, nginx), never
# expose it as plain HTTP.
#
# Build the image first from the repository root:
#   docker build -f services/forge-gateway/Dockerfile -t forge-gateway .

services:
  forge-gateway:
    image: ${GATEWAY_IMAGE:-forge-gateway}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      # The network (forge-core's variables, as for dg and git-remote-dash).
      DASH_FORGE_NETWORK: ${DASH_FORGE_NETWORK:-devnet}
      DASH_FORGE_DEVNET_NAME: ${DASH_FORGE_DEVNET_NAME:-sakura}
      DASH_FORGE_DAPI_ADDRESSES: ${DASH_FORGE_DAPI_ADDRESSES:-}
      DASH_FORGE_QUORUM_URL: ${DASH_FORGE_QUORUM_URL:-}
      # Where it is reachable, and what it links to.
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?set GATEWAY_PUBLIC_URL, e.g. https://git.forge.dashhq.org}
      GATEWAY_WEB_URL: ${GATEWAY_WEB_URL:-https://forge.dashhq.org}
      # What it serves.
      GATEWAY_ALL_PUBLIC: ${GATEWAY_ALL_PUBLIC:-true}
      GATEWAY_REPOS: ${GATEWAY_REPOS:-}
      GATEWAY_CACHE_MAX: ${GATEWAY_CACHE_MAX:-20G}
      GATEWAY_REPO_MAX: ${GATEWAY_REPO_MAX:-2G}
      # Abuse controls.
      GATEWAY_TRUST_PROXY: ${GATEWAY_TRUST_PROXY:-cloudflare}
      GATEWAY_RATE_PER_MIN: ${GATEWAY_RATE_PER_MIN:-240}
      GATEWAY_CLONES_PER_MIN: ${GATEWAY_CLONES_PER_MIN:-30}
      GATEWAY_CLONES_PER_CLIENT: ${GATEWAY_CLONES_PER_CLIENT:-2}
      GATEWAY_CLONES_MAX: ${GATEWAY_CLONES_MAX:-16}
      GATEWAY_NEW_MIRRORS_PER_HOUR: ${GATEWAY_NEW_MIRRORS_PER_HOUR:-10}
      # Freshness: polling always; relay wakes when a relay is configured.
      GATEWAY_POLL_SECS: ${GATEWAY_POLL_SECS:-120}
      GATEWAY_WAKE_URL: ${GATEWAY_WAKE_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - gateway-data:/data
    # A relay's wake secret, when GATEWAY_WAKE_URL is set: uncomment both blocks and set
    # GATEWAY_WAKE_SECRET_FILE=/run/secrets/wake in .env.
    # secrets:
    #   - wake
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g

# secrets:
#   wake:
#     file: ./wake-secret

volumes:
  gateway-data:
