# Self-host forge-gateway: `docker compose up -d` in this directory, with a `.env` next to it
# (see docs/hosting/forge-gateway.md for every variable). The gateway listens on
# 127.0.0.1:8080 of the host: put TLS in front of it (a Cloudflare tunnel, Caddy, nginx), never
# expose it as plain HTTP.
#
# The image: a release's, by digest (GATEWAY_IMAGE=ghcr.io/<owner>/forge-gateway@sha256:...
# in .env; a rollback is the previous digest), or build one from the repository root:
#   docker build -f services/forge-gateway/Dockerfile \
#     --build-arg DASH_FORGE_BUILD_SHA=$(git rev-parse HEAD) -t forge-gateway .
# (docs/hosting/forge-gateway.md, "Deploy a release".)

services:
  forge-gateway:
    image: ${GATEWAY_IMAGE:-forge-gateway}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      # The network (forge-core's variables, as for dg and git-remote-dash).
      DASH_FORGE_NETWORK: ${DASH_FORGE_NETWORK:-devnet}
      DASH_FORGE_DEVNET_NAME: ${DASH_FORGE_DEVNET_NAME:-sakura}
      DASH_FORGE_DAPI_ADDRESSES: ${DASH_FORGE_DAPI_ADDRESSES:-}
      DASH_FORGE_QUORUM_URL: ${DASH_FORGE_QUORUM_URL:-}
      # Where it is reachable, and what it links to.
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?set GATEWAY_PUBLIC_URL, e.g. https://git-forge.dashhq.org}
      GATEWAY_WEB_URL: ${GATEWAY_WEB_URL:-https://forge.dashhq.org}
      # What it serves.
      GATEWAY_ALL_PUBLIC: ${GATEWAY_ALL_PUBLIC:-true}
      GATEWAY_REPOS: ${GATEWAY_REPOS:-}
      GATEWAY_CACHE_MAX: ${GATEWAY_CACHE_MAX:-20G}
      # Keep GATEWAY_REPO_MAX well below the memory limit at the bottom of this file:
      # git-remote-dash holds a pack in memory while it indexes it. A repository nobody listed
      # in GATEWAY_REPOS is held to the lower GATEWAY_UNPINNED_REPO_MAX.
      GATEWAY_REPO_MAX: ${GATEWAY_REPO_MAX:-512M}
      GATEWAY_UNPINNED_REPO_MAX: ${GATEWAY_UNPINNED_REPO_MAX:-256M}
      # Repositories and owners this gateway refuses with 451 Unavailable For Legal Reasons
      # (one entry per line; re-read when the file changes). Optional: leave it empty for none.
      # Mount the file's directory (see volumes below), set the path in .env, e.g.
      # GATEWAY_DENY=/etc/forge-gateway/deny.txt
      GATEWAY_DENY: ${GATEWAY_DENY:-}
      # Abuse controls.
      GATEWAY_TRUST_PROXY: ${GATEWAY_TRUST_PROXY:-cloudflare}
      GATEWAY_RATE_PER_MIN: ${GATEWAY_RATE_PER_MIN:-240}
      GATEWAY_CLONES_PER_MIN: ${GATEWAY_CLONES_PER_MIN:-30}
      GATEWAY_CLONES_PER_CLIENT: ${GATEWAY_CLONES_PER_CLIENT:-2}
      GATEWAY_CLONES_MAX: ${GATEWAY_CLONES_MAX:-16}
      GATEWAY_NEW_MIRRORS_PER_HOUR: ${GATEWAY_NEW_MIRRORS_PER_HOUR:-10}
      # Freshness: polling always; relay wakes when a relay is configured.
      GATEWAY_POLL_SECS: ${GATEWAY_POLL_SECS:-120}
      GATEWAY_WAKE_URL: ${GATEWAY_WAKE_URL:-}
      # The path inside the container: /run/secrets/wake with the secrets blocks below.
      GATEWAY_WAKE_SECRET_FILE: ${GATEWAY_WAKE_SECRET_FILE:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - gateway-data:/data
      # The deny list's directory, read-only (a directory, not the file: an editor that
      # replaces the file would leave a single-file mount on the old one). Uncomment, create
      # ./deny/deny.txt, and set GATEWAY_DENY=/etc/forge-gateway/deny.txt in .env.
      # - ./deny:/etc/forge-gateway:ro
    # Rotate the container log by size: 5 files of 50 MB. That bounds the disk, not the age
    # (docs/hosting/forge-gateway.md, "Logs": the privacy notice's retention is yours to meet).
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"
    # A relay's wake secret, when GATEWAY_WAKE_URL is set: put it in ./wake-secret, readable
    # by the container's user (uid 10002), uncomment both blocks and set
    # GATEWAY_WAKE_SECRET_FILE=/run/secrets/wake in .env.
    # secrets:
    #   - wake
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g

# secrets:
#   wake:
#     file: ./wake-secret

volumes:
  gateway-data:
