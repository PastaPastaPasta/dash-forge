[package]
name = "forge-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "forge-gateway — optional read-only git-over-HTTPS mirror of public Dash Forge repos, with badges, Atom feeds and link previews."

[lib]
path = "src/lib.rs"

[[bin]]
name = "forge-gateway"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../../crates/forge-core" }
anyhow.workspace = true
thiserror.workspace = true
clap = { workspace = true, features = ["env"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
