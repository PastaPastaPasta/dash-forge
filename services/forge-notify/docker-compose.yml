# Self-host forge-notify: `docker compose up -d` in this directory, with a `.env` next to it and
# the three secret files below (see docs/hosting/forge-notify.md for every variable). The service
# listens on 127.0.0.1:8080 of the host: put TLS in front of it (a Cloudflare tunnel, Caddy,
# nginx), never expose it as plain HTTP.
#
# Build the image first from the repository root:
#   docker build -f services/forge-notify/Dockerfile -t forge-notify .
#
# Make the keys once, and keep them (losing the data key loses every stored address):
#   docker run --rm forge-notify keys > keys.env   # then split into the files below, chmod 600

services:
  forge-notify:
    image: ${NOTIFY_IMAGE:-forge-notify}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${NOTIFY_HOST_PORT:-8080}:8080"
    environment:
      # The network.
      FORGE_NOTIFY_NETWORK: ${FORGE_NOTIFY_NETWORK:-devnet}
      FORGE_NOTIFY_DEVNET_NAME: ${FORGE_NOTIFY_DEVNET_NAME:-sakura}
      FORGE_NOTIFY_DAPI_ADDRESSES: ${FORGE_NOTIFY_DAPI_ADDRESSES:-}
      # Where it is reachable, who runs it, and what it links to.
      FORGE_NOTIFY_PUBLIC_URL: ${FORGE_NOTIFY_PUBLIC_URL:?set FORGE_NOTIFY_PUBLIC_URL, e.g. https://notify.forge.dashhq.org}
      FORGE_NOTIFY_OPERATOR: ${FORGE_NOTIFY_OPERATOR:-}
      FORGE_NOTIFY_WEB_URL: ${FORGE_NOTIFY_WEB_URL:-https://forge.dashhq.org}
      FORGE_NOTIFY_ALLOWED_ORIGINS: ${FORGE_NOTIFY_ALLOWED_ORIGINS:-}
      FORGE_NOTIFY_PRIVACY_URL: ${FORGE_NOTIFY_PRIVACY_URL:-}
      FORGE_NOTIFY_CONTACT: ${FORGE_NOTIFY_CONTACT:-}
      # Email (leave FORGE_NOTIFY_SMTP_HOST empty for push only).
      FORGE_NOTIFY_SMTP_HOST: ${FORGE_NOTIFY_SMTP_HOST:-}
      FORGE_NOTIFY_SMTP_PORT: ${FORGE_NOTIFY_SMTP_PORT:-}
      FORGE_NOTIFY_SMTP_TLS: ${FORGE_NOTIFY_SMTP_TLS:-starttls}
      FORGE_NOTIFY_SMTP_USERNAME: ${FORGE_NOTIFY_SMTP_USERNAME:-}
      FORGE_NOTIFY_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      FORGE_NOTIFY_MAIL_FROM: ${FORGE_NOTIFY_MAIL_FROM:-}
      # Web Push (leave FORGE_NOTIFY_VAPID_SUBJECT empty for email only).
      FORGE_NOTIFY_VAPID_SUBJECT: ${FORGE_NOTIFY_VAPID_SUBJECT:-}
      FORGE_NOTIFY_VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      # Encryption at rest.
      FORGE_NOTIFY_DATA_KEY_FILE: /run/secrets/data_key
      # Abuse controls and caps.
      FORGE_NOTIFY_TRUST_PROXY: ${FORGE_NOTIFY_TRUST_PROXY:-true}
      FORGE_NOTIFY_PER_IP_PER_MINUTE: ${FORGE_NOTIFY_PER_IP_PER_MINUTE:-60}
      FORGE_NOTIFY_MAX_SUBSCRIBERS: ${FORGE_NOTIFY_MAX_SUBSCRIBERS:-10000}
      FORGE_NOTIFY_MAX_REPOS_PER_USER: ${FORGE_NOTIFY_MAX_REPOS_PER_USER:-50}
      FORGE_NOTIFY_MAX_REPOS: ${FORGE_NOTIFY_MAX_REPOS:-2000}
      FORGE_NOTIFY_DAILY_SEND_BUDGET: ${FORGE_NOTIFY_DAILY_SEND_BUDGET:-20000}
      FORGE_NOTIFY_PER_USER_DAILY: ${FORGE_NOTIFY_PER_USER_DAILY:-200}
      FORGE_NOTIFY_DIGEST_HOUR: ${FORGE_NOTIFY_DIGEST_HOUR:-8}
      RUST_LOG: ${RUST_LOG:-info}
    secrets:
      - data_key
      - vapid_private_key
      - smtp_password
    volumes:
      - notify-data:/data
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

secrets:
  data_key:
    file: ./secrets/data_key
  vapid_private_key:
    file: ./secrets/vapid_private_key
  smtp_password:
    file: ./secrets/smtp_password

volumes:
  notify-data:
